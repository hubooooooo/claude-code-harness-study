<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 496" font-family="'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0d9488"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="760" height="496" fill="#fafbfc" rx="8"/>

  <!-- 标题栏 -->
  <rect x="0" y="0" width="760" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="760" height="8" fill="url(#header)"/>
  <text x="380" y="23" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">后台任务 — 慢操作放后台，智能体循环继续运行</text>
  <text x="380" y="40" fill="#bfdbfe" font-size="10" text-anchor="middle">Background Tasks — slow operations run in the background while the agent loop keeps going</text>

  <!-- 图例 -->
  <rect x="30" y="59" width="14" height="10" rx="2" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="50" y="68" fill="#991b1b" font-size="10" font-weight="600">s11 新增</text>
  <text x="104" y="68" fill="#64748b" font-size="10">· 第一行沿用 s04 基础循环 (kernel)</text>

  <!-- ===== 第一行：s04 循环（精简） ===== -->
  <!-- messages -->
  <rect x="30" y="88" width="90" height="48" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="75" y="108" fill="#334155" font-size="11" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">messages[]</text>
  <text x="75" y="125" fill="#64748b" font-size="10" text-anchor="middle">消息列表</text>

  <line x1="120" y1="112" x2="136" y2="112" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- system prompt -->
  <rect x="138" y="82" width="118" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="197" y="104" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">系统提示词</text>
  <text x="197" y="119" fill="#64748b" font-size="10" text-anchor="middle">system prompt</text>
  <text x="197" y="133" fill="#64748b" font-size="10" text-anchor="middle">固定指令</text>

  <line x1="256" y1="112" x2="272" y2="112" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LLM call -->
  <rect x="274" y="82" width="112" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="330" y="104" fill="#1e3a5f" font-size="12" font-weight="600" text-anchor="middle">大模型调用</text>
  <text x="330" y="119" fill="#475569" font-size="10" text-anchor="middle">LLM call</text>
  <text x="330" y="133" fill="#475569" font-size="10" text-anchor="middle">发起模型请求</text>

  <line x1="386" y1="112" x2="402" y2="112" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 工具分发（展开） -->
  <rect x="404" y="82" width="326" height="60" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="567" y="100" fill="#92400e" font-size="12" font-weight="600" text-anchor="middle">工具分发 (Tool Dispatch)</text>
  <text x="420" y="117" fill="#475569" font-size="10"><tspan fill="#b45309" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">run_in_background=false</tspan> → 同步执行</text>
  <text x="420" y="133" fill="#0f766e" font-size="10" font-weight="700"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">run_in_background=true</tspan> → 放进后台线程</text>

  <!-- 回到下一轮 -->
  <path d="M 730 112 L 746 112 L 746 154 L 75 154 L 75 138" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6,3"/>

  <!-- 箭头：工具分发 → 后台线程 -->
  <path d="M 470 142 L 470 172 L 200 172 L 200 202" fill="none" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <text x="335" y="168" fill="#0f766e" font-size="10" font-weight="600" text-anchor="middle">慢操作 (slow op)</text>

  <!-- ===== s11 新增区域 ===== -->
  <rect x="30" y="180" width="700" height="134" rx="8" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="42" y="196" fill="#991b1b" font-size="10" font-weight="700">s11 新增</text>

  <!-- 后台线程执行 -->
  <rect x="46" y="204" width="310" height="98" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="201" y="224" fill="#115e59" font-size="12" font-weight="700" text-anchor="middle">后台线程执行 <tspan fill="#0f766e" font-size="10" font-weight="400">(background thread)</tspan></text>
  <text x="62" y="244" fill="#0f766e" font-size="10" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">BackgroundManager.start(block)</text>
  <text x="62" y="260" fill="#64748b" font-size="10" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">threading.Thread(target=worker, daemon=True)</text>
  <text x="62" y="276" fill="#475569" font-size="10">结果写入 <tspan fill="#334155" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">background_results[id]</tspan></text>
  <text x="62" y="292" fill="#475569" font-size="10">由 <tspan fill="#334155" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">threading.Lock</tspan> 加锁保护</text>

  <!-- 箭头：后台线程 → 后续收集 -->
  <line x1="356" y1="253" x2="402" y2="253" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arrow-teal)"/>

  <!-- 后续轮次收集 -->
  <rect x="404" y="204" width="310" height="98" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="559" y="224" fill="#115e59" font-size="12" font-weight="700" text-anchor="middle">后续轮次收集 <tspan fill="#0f766e" font-size="10" font-weight="400">(collect on later turns)</tspan></text>
  <text x="420" y="244" fill="#475569" font-size="10">调 LLM 前：<tspan fill="#0f766e" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">collect_background_results()</tspan></text>
  <text x="420" y="262" fill="#475569" font-size="10">已完成 → <tspan fill="#334155" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">&lt;task_notification&gt;</tspan> 加入 <tspan fill="#334155" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">messages</tspan></text>
  <text x="420" y="280" fill="#475569" font-size="10">运行中 → 保留任务状态，之后再收集</text>

  <!-- ===== 显式参数 ===== -->
  <rect x="30" y="328" width="700" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="46" y="352" fill="#1e3a5f" font-size="11" font-weight="600">显式参数 <tspan fill="#64748b" font-size="10" font-weight="400">(explicit flag)：</tspan></text>
  <rect x="196" y="338" width="50" height="20" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="221" y="352" fill="#475569" font-size="10" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">false</text>
  <text x="254" y="352" fill="#475569" font-size="10"><tspan fill="#334155" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">run_in_background=false</tspan> · 同步执行</text>
  <rect x="466" y="338" width="50" height="20" rx="4" fill="#f0fdfa" stroke="#0d9488" stroke-width="1"/>
  <text x="491" y="352" fill="#0f766e" font-size="10" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">true</text>
  <text x="524" y="352" fill="#475569" font-size="10"><tspan fill="#334155" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">run_in_background=true</tspan> · 后台执行</text>

  <!-- ===== 时间线对比 ===== -->
  <!-- s04 同步 -->
  <rect x="30" y="384" width="340" height="96" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <text x="200" y="404" fill="#991b1b" font-size="11" font-weight="700" text-anchor="middle">s04 同步执行 <tspan fill="#b91c1c" font-size="10" font-weight="400">(synchronous)</tspan></text>
  <rect x="48" y="418" width="80" height="22" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="88" y="433" fill="#1e3a5f" font-size="10" text-anchor="middle">LLM 调用</text>
  <rect x="134" y="418" width="170" height="22" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="219" y="433" fill="#991b1b" font-size="10" text-anchor="middle">等待 bash 返回（阻塞）</text>
  <rect x="310" y="418" width="46" height="22" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="333" y="433" fill="#1e3a5f" font-size="10" text-anchor="middle">下一轮</text>
  <text x="48" y="466" fill="#b91c1c" font-size="10">当前工具调用被阻塞，命令结束后才能继续</text>

  <!-- s11 后台 -->
  <rect x="390" y="384" width="340" height="96" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="560" y="404" fill="#166534" font-size="11" font-weight="700" text-anchor="middle">s11 后台执行 <tspan fill="#15803d" font-size="10" font-weight="400">(background)</tspan></text>
  <rect x="408" y="418" width="80" height="22" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="448" y="433" fill="#1e3a5f" font-size="10" text-anchor="middle">LLM 调用</text>
  <rect x="494" y="418" width="104" height="22" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="546" y="433" fill="#166534" font-size="10" text-anchor="middle">继续其他工具</text>
  <rect x="604" y="418" width="108" height="22" rx="3" fill="#f0fdfa" stroke="#0d9488" stroke-width="1"/>
  <text x="658" y="433" fill="#115e59" font-size="10" text-anchor="middle">后续轮次收集</text>
  <text x="408" y="466" fill="#15803d" font-size="10">bash 在后台线程运行，智能体循环不必等待</text>
</svg>
