<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 572" font-family="'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0d9488"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="760" height="572" fill="#fafbfc" rx="8"/>

  <!-- 标题栏 -->
  <rect x="0" y="0" width="760" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="760" height="8" fill="url(#header)"/>
  <text x="380" y="23" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">定时调度 — 独立调度线程 + <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">cron_queue</tspan> 注入点</text>
  <text x="380" y="40" fill="#bfdbfe" font-size="10" text-anchor="middle">Cron Scheduler — a dedicated scheduler thread plus a cron_queue injection point</text>

  <!-- 图例 -->
  <rect x="30" y="59" width="14" height="10" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="50" y="68" fill="#64748b" font-size="10" font-weight="600">s04 工具与钩子 (tools &amp; hooks)</text>
  <rect x="230" y="59" width="14" height="10" rx="2" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="250" y="68" fill="#991b1b" font-size="10" font-weight="600">s12 新增</text>

  <!-- ===== 第一行：完整的智能体循环 ===== -->

  <!-- consume_cron_queue（s12 新增） -->
  <rect x="30" y="98" width="92" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="76" y="116" fill="#991b1b" font-size="10" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">consume_</text>
  <text x="76" y="129" fill="#991b1b" font-size="10" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">cron_queue</text>
  <text x="76" y="143" fill="#b91c1c" font-size="10" text-anchor="middle">取出到期任务</text>
  <text x="76" y="156" fill="#dc2626" font-size="9" font-weight="600" text-anchor="middle">★ s12 注入点</text>

  <line x1="122" y1="130" x2="134" y2="130" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- messages -->
  <rect x="136" y="106" width="76" height="48" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="174" y="126" fill="#334155" font-size="11" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">messages[]</text>
  <text x="174" y="143" fill="#64748b" font-size="10" text-anchor="middle">消息列表</text>

  <line x1="212" y1="130" x2="224" y2="130" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- system prompt -->
  <rect x="226" y="98" width="100" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="276" y="120" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">系统提示词</text>
  <text x="276" y="135" fill="#64748b" font-size="10" text-anchor="middle">system prompt</text>
  <text x="276" y="150" fill="#64748b" font-size="10" text-anchor="middle"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">SYSTEM</tspan> · 基础指令</text>

  <line x1="326" y1="130" x2="338" y2="130" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LLM call -->
  <rect x="340" y="98" width="144" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="412" y="120" fill="#1e3a5f" font-size="12" font-weight="600" text-anchor="middle">大模型调用</text>
  <text x="412" y="135" fill="#475569" font-size="10" text-anchor="middle">LLM call · 发起模型请求</text>
  <text x="412" y="150" fill="#475569" font-size="10" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">client.messages.create</text>

  <line x1="484" y1="130" x2="496" y2="130" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 工具分发（展开） -->
  <rect x="498" y="78" width="232" height="104" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="614" y="96" fill="#92400e" font-size="12" font-weight="600" text-anchor="middle">工具分发 (Tool Dispatch)</text>
  <text x="510" y="113" fill="#475569" font-size="10">基础工具 → <tspan fill="#b45309" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">bash read write edit glob</tspan></text>
  <text x="510" y="128" fill="#475569" font-size="10"><tspan fill="#b45309" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">PreToolUse</tspan> → 权限检查 + 日志</text>
  <text x="510" y="143" fill="#991b1b" font-size="10" font-weight="700">★ s12 定时工具 → <tspan fill="#dc2626" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">schedule_cron</tspan></text>
  <text x="560" y="157" fill="#dc2626" font-size="10" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">list_crons · cancel_cron</text>
  <text x="510" y="172" fill="#475569" font-size="10"><tspan fill="#b45309" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">PostToolUse</tspan> → 输出检查</text>

  <!-- 回到下一轮 -->
  <path d="M 730 130 L 746 130 L 746 196 L 76 196 L 76 164" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6,3"/>
  <text x="370" y="190" fill="#64748b" font-size="10" text-anchor="middle">循环回去 (loop back)：<tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">tool_results</tspan> → 下一轮</text>

  <!-- ===== s12 新增区域 ===== -->
  <rect x="26" y="208" width="708" height="240" rx="8" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="38" y="224" fill="#991b1b" font-size="10" font-weight="700">s12 新增</text>

  <!-- 调度线程 -->
  <rect x="40" y="232" width="280" height="116" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="180" y="252" fill="#115e59" font-size="12" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">cron_scheduler_loop</text>
  <text x="180" y="267" fill="#0f766e" font-size="10" text-anchor="middle">独立守护线程 (daemon thread)</text>
  <text x="54" y="287" fill="#0f766e" font-size="10" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">wait(1s) → poll_due_jobs(datetime.now())</text>
  <text x="54" y="303" fill="#475569" font-size="10">时间匹配 → 持久化状态 → 加入队列</text>
  <text x="54" y="319" fill="#475569" font-size="10"><tspan fill="#334155" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">last_fired</tspan> 防止同一分钟重复入队</text>
  <text x="54" y="335" fill="#475569" font-size="10">模型接收 prompt 后删除一次性任务</text>

  <!-- 箭头：调度线程 → cron_queue -->
  <line x1="220" y1="348" x2="220" y2="378" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arrow-teal)"/>

  <!-- cron_queue -->
  <rect x="140" y="380" width="160" height="56" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="220" y="399" fill="#5b21b6" font-size="12" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">cron_queue</text>
  <text x="220" y="414" fill="#6d28d9" font-size="10" text-anchor="middle">由 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">cron_lock</tspan> 加锁保护</text>
  <text x="220" y="428" fill="#64748b" font-size="10" text-anchor="middle">调度线程写入 · 处理线程交付</text>

  <!-- 箭头：cron_queue → consume_cron_queue（回到第一行） -->
  <path d="M 140 408 L 18 408 L 18 130 L 28 130" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="83" y="402" fill="#6d28d9" font-size="10" font-weight="600" text-anchor="middle">Agent 空闲后交付</text>

  <!-- CronJob + 持久化 -->
  <rect x="340" y="232" width="384" height="116" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="532" y="252" fill="#5b21b6" font-size="12" font-weight="700" text-anchor="middle"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">CronJob</tspan> + 持久化 <tspan fill="#6d28d9" font-size="10" font-weight="400">(persistence)</tspan></text>
  <text x="356" y="272" fill="#5b21b6" font-size="10" font-weight="600">核心字段：<tspan fill="#475569" font-weight="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">id, cron, prompt, recurring, durable</tspan></text>
  <text x="356" y="290" fill="#6d28d9" font-size="10" font-weight="600">持久任务 (durable) → <tspan fill="#5b21b6" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">.scheduled_tasks.json</tspan></text>
  <text x="372" y="304" fill="#64748b" font-size="10">重启后由 <tspan fill="#475569" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">load_durable_jobs</tspan> 恢复</text>
  <text x="356" y="322" fill="#6d28d9" font-size="10" font-weight="600">会话任务 (session-only) → 只存在内存</text>
  <text x="372" y="336" fill="#64748b" font-size="10">进程关闭即丢失</text>

  <!-- 运行边界警告 -->
  <rect x="340" y="380" width="384" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="532" y="403" fill="#991b1b" font-size="11" font-weight="700" text-anchor="middle">⚠ 进程关闭 = 调度停止（不是操作系统级 crontab）</text>
  <text x="532" y="422" fill="#b91c1c" font-size="10" text-anchor="middle">Process exit stops the scheduler — not an OS-level crontab</text>

  <!-- ===== 第三行：五段式 cron 表达式 ===== -->
  <rect x="30" y="462" width="700" height="94" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="50" y="484" fill="#1e3a5f" font-size="12" font-weight="600">五段式 Cron 表达式 <tspan fill="#64748b" font-size="10" font-weight="400">(5-field cron expression)</tspan></text>

  <rect x="50" y="494" width="52" height="22" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="76" y="509" fill="#1e3a5f" font-size="11" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">*</text>
  <rect x="108" y="494" width="52" height="22" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="134" y="509" fill="#1e3a5f" font-size="11" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">*</text>
  <rect x="166" y="494" width="52" height="22" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="192" y="509" fill="#1e3a5f" font-size="11" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">*</text>
  <rect x="224" y="494" width="52" height="22" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="250" y="509" fill="#1e3a5f" font-size="11" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">*</text>
  <rect x="282" y="494" width="52" height="22" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="308" y="509" fill="#1e3a5f" font-size="11" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">*</text>

  <text x="76" y="532" fill="#334155" font-size="10" text-anchor="middle">分钟</text>
  <text x="134" y="532" fill="#334155" font-size="10" text-anchor="middle">小时</text>
  <text x="192" y="532" fill="#334155" font-size="10" text-anchor="middle">日</text>
  <text x="250" y="532" fill="#334155" font-size="10" text-anchor="middle">月</text>
  <text x="308" y="532" fill="#334155" font-size="10" text-anchor="middle">星期</text>
  <text x="76" y="545" fill="#64748b" font-size="9" text-anchor="middle">minute</text>
  <text x="134" y="545" fill="#64748b" font-size="9" text-anchor="middle">hour</text>
  <text x="192" y="545" fill="#64748b" font-size="9" text-anchor="middle">day</text>
  <text x="250" y="545" fill="#64748b" font-size="9" text-anchor="middle">month</text>
  <text x="308" y="545" fill="#64748b" font-size="9" text-anchor="middle">weekday</text>

  <line x1="360" y1="494" x2="360" y2="546" stroke="#e2e8f0" stroke-width="1"/>

  <text x="380" y="502" fill="#475569" font-size="10"><tspan fill="#1e3a5f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">*/5 * * * *</tspan> → 每 5 分钟</text>
  <text x="560" y="502" fill="#475569" font-size="10"><tspan fill="#1e3a5f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">0 9 * * *</tspan> → 每天 9:00</text>
  <text x="380" y="520" fill="#475569" font-size="10"><tspan fill="#1e3a5f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">0 9 * * 1-5</tspan> → 工作日 9:00</text>
  <text x="560" y="520" fill="#475569" font-size="10"><tspan fill="#1e3a5f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">* * * * *</tspan> → 每分钟</text>
  <text x="380" y="541" fill="#475569" font-size="10">支持的写法 (syntax)：<tspan fill="#1e3a5f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">*, */N, N, N-M, N,M,...</tspan></text>
</svg>
