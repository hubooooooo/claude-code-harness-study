<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" font-family="'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0d9488"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="760" height="500" fill="#fafbfc" rx="8"/>

  <!-- 标题栏 -->
  <rect x="0" y="0" width="760" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="760" height="8" fill="url(#header)"/>
  <text x="380" y="23" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">MCP 工具 — 工具发现 + 动态工具池</text>
  <text x="380" y="40" fill="#bfdbfe" font-size="10" text-anchor="middle">MCP Tools — tool discovery plus a dynamic tool pool</text>

  <!-- 图例 -->
  <rect x="30" y="59" width="14" height="10" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="50" y="68" fill="#64748b" font-size="10" font-weight="600">s04 基础循环 (kernel)</text>
  <rect x="180" y="59" width="14" height="10" rx="2" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="200" y="68" fill="#991b1b" font-size="10" font-weight="600">s14 新增</text>

  <!-- ===== 第一行：主循环 ===== -->
  <!-- turn -->
  <rect x="30" y="93" width="70" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="65" y="118" fill="#1e3a5f" font-size="12" font-weight="600" text-anchor="middle">回合</text>
  <text x="65" y="133" fill="#475569" font-size="10" text-anchor="middle">turn</text>

  <line x1="100" y1="121" x2="110" y2="121" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- messages -->
  <rect x="112" y="97" width="78" height="48" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="151" y="117" fill="#334155" font-size="11" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">messages[]</text>
  <text x="151" y="134" fill="#64748b" font-size="10" text-anchor="middle">消息列表</text>

  <line x1="190" y1="121" x2="200" y2="121" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- prompt -->
  <rect x="202" y="93" width="88" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="246" y="118" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">系统提示词</text>
  <text x="246" y="133" fill="#64748b" font-size="10" text-anchor="middle">prompt</text>

  <line x1="290" y1="121" x2="300" y2="121" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LLM -->
  <rect x="302" y="93" width="90" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="347" y="118" fill="#1e3a5f" font-size="12" font-weight="600" text-anchor="middle">大模型</text>
  <text x="347" y="133" fill="#475569" font-size="10" text-anchor="middle">LLM</text>

  <line x1="392" y1="121" x2="402" y2="121" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 工具分发（动态工具池） -->
  <rect x="404" y="78" width="326" height="86" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="567" y="96" fill="#92400e" font-size="12" font-weight="600" text-anchor="middle">工具分发 · 动态工具池 <tspan fill="#b45309" font-size="10" font-weight="400">(dynamic tool pool)</tspan></text>
  <text x="420" y="112" fill="#475569" font-size="10">基础工具 → <tspan fill="#b45309" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">bash read write edit glob</tspan></text>
  <text x="420" y="126" fill="#475569" font-size="10"><tspan fill="#b91c1c" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">connect_mcp</tspan> → 连接 server、发现工具</text>
  <text x="420" y="140" fill="#475569" font-size="10">已连接 server 的 <tspan fill="#0f766e" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">mcp__server__tool</tspan></text>
  <text x="420" y="155" fill="#991b1b" font-size="10" font-weight="700">★ s14 新增：<tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">connect_mcp</tspan> + 动态 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">mcp__server__tool</tspan> 工具</text>

  <!-- 回到下一回合 -->
  <path d="M 730 121 L 746 121 L 746 178 L 65 178 L 65 151" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6,3"/>

  <!-- ===== 第二行：MCP 架构（s14 新增） ===== -->
  <rect x="30" y="192" width="700" height="218" rx="8" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="380" y="212" fill="#991b1b" font-size="12" font-weight="700" text-anchor="middle">MCP 架构（s14 新增：标准协议 + 外部工具动态接入） <tspan fill="#b91c1c" font-size="10" font-weight="400">MCP architecture</tspan></text>

  <!-- Agent 侧 -->
  <rect x="50" y="226" width="260" height="132" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="180" y="244" fill="#1e3a5f" font-size="12" font-weight="700" text-anchor="middle">Agent 侧 <tspan fill="#475569" font-size="11" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">(MCPClient)</tspan></text>

  <rect x="64" y="254" width="232" height="28" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="180" y="272" fill="#475569" font-size="10" text-anchor="middle"><tspan fill="#1e3a5f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">connect_mcp</tspan> → 发现工具 → 注册工具</text>

  <rect x="64" y="288" width="232" height="28" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="180" y="306" fill="#475569" font-size="10" text-anchor="middle"><tspan fill="#1e3a5f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">assemble_tool_pool</tspan> 组装内置 + MCP 工具</text>

  <rect x="64" y="322" width="232" height="28" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="180" y="340" fill="#475569" font-size="10" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"><tspan fill="#1e3a5f">handler</tspan> → call_tool("search", args)</text>

  <!-- 通信箭头 -->
  <line x1="310" y1="268" x2="448" y2="268" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <text x="379" y="262" fill="#0f766e" font-size="10" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">tools/list</text>
  <text x="379" y="282" fill="#64748b" font-size="9" text-anchor="middle">列出工具</text>

  <line x1="450" y1="314" x2="312" y2="314" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <text x="379" y="308" fill="#0f766e" font-size="10" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">tools/call</text>
  <text x="379" y="328" fill="#64748b" font-size="9" text-anchor="middle">调用工具，返回结果</text>

  <!-- MCP 服务端 -->
  <rect x="450" y="226" width="260" height="132" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="580" y="244" fill="#115e59" font-size="12" font-weight="700" text-anchor="middle">MCP 服务端 <tspan fill="#0f766e" font-size="10" font-weight="400">(MCP servers · 外部服务)</tspan></text>

  <rect x="464" y="254" width="232" height="28" rx="4" fill="#ffffff" stroke="#0d9488" stroke-width="1"/>
  <text x="580" y="272" fill="#0f766e" font-size="10" text-anchor="middle"><tspan font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">docs</tspan> 服务：<tspan fill="#115e59" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">search · get_version</tspan></text>

  <rect x="464" y="288" width="232" height="28" rx="4" fill="#ffffff" stroke="#0d9488" stroke-width="1"/>
  <text x="580" y="306" fill="#0f766e" font-size="10" text-anchor="middle"><tspan font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">deploy</tspan> 服务：<tspan fill="#115e59" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">trigger · status</tspan></text>

  <rect x="464" y="322" width="232" height="28" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="580" y="340" fill="#64748b" font-size="10" text-anchor="middle">本章用进程内模拟 server (mock)</text>

  <!-- 命名规则 -->
  <rect x="50" y="370" width="660" height="28" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="380" y="388" fill="#92400e" font-size="10" text-anchor="middle">工具命名：<tspan font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">mcp__{server}__{tool}</tspan> → 例：<tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">mcp__docs__search · mcp__deploy__trigger</tspan> · 避免不同 server 的工具重名</text>

  <!-- ===== 第三行：底部说明 ===== -->
  <rect x="30" y="422" width="700" height="26" rx="6" fill="#f1f5f9"/>
  <rect x="48" y="430" width="14" height="10" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="68" y="439" fill="#475569" font-size="10">s04：基础工具 + 钩子 (Hooks) + 权限 (Permission)</text>
  <rect x="400" y="430" width="14" height="10" rx="2" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="420" y="439" fill="#475569" font-size="10">s14：MCP + 动态工具池 (dynamic tool pool)</text>

  <!-- 下一章 -->
  <rect x="30" y="458" width="700" height="26" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="380" y="475" fill="#1e3a5f" font-size="10" font-weight="600" text-anchor="middle">下一章 s15：把工具、权限、团队、worktree、MCP 等机制合回同一个 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">while True</tspan> 循环。</text>
</svg>
