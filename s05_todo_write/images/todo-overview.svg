<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="450" fill="#fafbfc" rx="8"/>

  <!-- 标题栏 -->
  <rect x="0" y="0" width="800" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="800" height="8" fill="url(#header)"/>
  <rect x="0" y="45" width="800" height="3" fill="#00e75e"/>
  <text x="400" y="23" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">任务规划 (TodoWrite) — 循环不变，只多一个工具自动分发</text>
  <text x="400" y="40" fill="#b3b3b3" font-size="10" text-anchor="middle">TodoWrite — same loop, one more tool in the dispatch map</text>

  <!-- ===== s04 保留 ===== -->
  <text x="40" y="74" fill="#94a3b8" font-size="11" font-weight="600">s04 保留 (kept from s04)</text>

  <!-- messages[] -->
  <rect x="40" y="88" width="110" height="48" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="95" y="108" fill="#334155" font-size="12" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">messages[]</text>
  <text x="95" y="125" fill="#64748b" font-size="10" text-anchor="middle">消息列表</text>

  <!-- messages → LLM -->
  <line x1="150" y1="112" x2="188" y2="112" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LLM -->
  <rect x="190" y="84" width="120" height="56" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="250" y="106" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">大模型 (LLM)</text>
  <text x="250" y="126" fill="#475569" font-size="10" text-anchor="middle">有 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">tool_use</tspan> 块？</text>

  <!-- 否 → 返回结果 -->
  <line x1="250" y1="140" x2="250" y2="168" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="260" y="159" fill="#16a34a" font-size="10" font-weight="600">否</text>
  <rect x="195" y="170" width="110" height="40" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="250" y="187" fill="#166534" font-size="12" font-weight="600" text-anchor="middle">返回结果</text>
  <text x="250" y="202" fill="#15803d" font-size="9" text-anchor="middle">循环结束</text>

  <!-- 是 → 钩子 -->
  <line x1="310" y1="112" x2="358" y2="112" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <text x="334" y="104" fill="#d97706" font-size="10" font-weight="600" text-anchor="middle">是</text>

  <!-- 钩子 PreToolUse（s04） -->
  <rect x="360" y="84" width="110" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="415" y="103" fill="#166534" font-size="11" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">trigger_hooks</text>
  <text x="415" y="118" fill="#15803d" font-size="10" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">PreToolUse</text>
  <text x="415" y="132" fill="#15803d" font-size="9" text-anchor="middle">工具执行前钩子</text>

  <!-- 钩子 → TOOL_HANDLERS -->
  <line x1="470" y1="112" x2="508" y2="112" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== TOOL_HANDLERS（含 s05 新增 todo_write） ===== -->
  <rect x="510" y="72" width="150" height="166" rx="10" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="585" y="90" fill="#92400e" font-size="11" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">TOOL_HANDLERS</text>
  <text x="585" y="103" fill="#b45309" font-size="9" text-anchor="middle">工具分发表 (dispatch map)</text>

  <!-- s04 保留的工具 -->
  <rect x="522" y="110" width="126" height="22" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
  <text x="585" y="125" fill="#92400e" font-size="10" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">bash · read · write</text>
  <rect x="522" y="138" width="126" height="22" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
  <text x="585" y="153" fill="#92400e" font-size="10" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">edit · glob</text>

  <!-- s05 新增：todo_write -->
  <rect x="522" y="166" width="126" height="24" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="585" y="182" fill="#991b1b" font-size="11" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">todo_write</text>
  <text x="585" y="206" fill="#64748b" font-size="9" text-anchor="middle">→ 更新进程内 TODO 列表</text>
  <text x="585" y="227" fill="#dc2626" font-size="11" font-weight="700" text-anchor="middle">s05 新增</text>

  <!-- 回环：工具结果追加回 messages[] -->
  <path d="M 660 112 L 700 112 L 700 268 L 95 268 L 95 138" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6,3"/>
  <text x="400" y="288" fill="#64748b" font-size="10" text-anchor="middle">工具结果追加到 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">messages[]</tspan>，循环继续</text>

  <!-- ===== 催更提醒 Nag Reminder（s05 新增） ===== -->
  <rect x="100" y="308" width="600" height="74" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="120" y="330" fill="#991b1b" font-size="12" font-weight="700">催更提醒 (Nag Reminder)<tspan fill="#dc2626" font-size="10" font-weight="600" dx="10">s05 新增</tspan></text>
  <text x="120" y="350" fill="#b91c1c" font-size="10">连续 3 轮工具调用都没用 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">todo_write</tspan> → 在第 3 轮的工具结果里自动追加：</text>
  <text x="120" y="368" fill="#991b1b" font-size="10"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">&lt;reminder&gt;Update your todos.&lt;/reminder&gt;</tspan><tspan fill="#b91c1c">（提醒更新待办），随后计数器清零</tspan></text>

  <!-- 图例 -->
  <rect x="100" y="398" width="600" height="32" rx="6" fill="#f1f5f9"/>
  <rect x="120" y="408" width="14" height="12" rx="2" fill="#fef2f2" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="142" y="418" fill="#334155" font-size="10">s05 新增：<tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">todo_write</tspan> + 催更提醒 (nag reminder)</text>
  <rect x="420" y="408" width="14" height="12" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="442" y="418" fill="#334155" font-size="10">其余为 s04 保留：循环、钩子、5 个基础工具</text>
</svg>
