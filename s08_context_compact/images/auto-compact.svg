<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 418" font-family="'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="720" height="418" fill="#fafbfc" rx="8"/>

  <!-- 标题栏 -->
  <rect x="0" y="0" width="720" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="23" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">第 4 步：<tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">compact_history</tspan> — 生成历史摘要</text>
  <text x="360" y="40" fill="#bfdbfe" font-size="10" text-anchor="middle">Step 4: compact_history — summarize the conversation history</text>

  <!-- 触发条件 -->
  <rect x="20" y="62" width="680" height="46" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="35" y="80" fill="#991b1b" font-size="11" font-weight="600">触发条件</text>
  <text x="35" y="97" fill="#b91c1c" font-size="9">(trigger)</text>
  <text x="105" y="80" fill="#991b1b" font-size="11">前三步执行后，<tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">estimate_chars(messages) &gt; CONTEXT_CHAR_LIMIT</tspan></text>
  <text x="105" y="97" fill="#b91c1c" font-size="10">当前实现的 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">CONTEXT_CHAR_LIMIT</tspan> 为 50,000 个字符</text>

  <!-- A：保存 transcript -->
  <rect x="20" y="120" width="200" height="116" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="120" y="144" fill="#1e3a5f" font-size="12" font-weight="700" text-anchor="middle">A · 保存 transcript</text>
  <text x="36" y="166" fill="#475569" font-size="10">完整对话写入 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">.transcripts/</tspan></text>
  <text x="36" y="182" fill="#475569" font-size="10">JSONL 格式，一行一条消息</text>
  <text x="36" y="198" fill="#475569" font-size="10">文件名：<tspan font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">transcript_{uuid}.jsonl</tspan></text>
  <text x="36" y="220" fill="#64748b" font-size="9">信息没有丢失，只是移出活跃上下文</text>

  <line x1="225" y1="178" x2="265" y2="178" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- B：生成事实摘要 -->
  <rect x="270" y="120" width="200" height="116" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="370" y="144" fill="#1e3a5f" font-size="12" font-weight="700" text-anchor="middle">B · 生成事实摘要</text>
  <text x="286" y="166" fill="#475569" font-size="10">原对话只作为待摘要的数据</text>
  <text x="286" y="182" fill="#475569" font-size="10">摘要保留 5 类信息：</text>
  <text x="296" y="197" fill="#64748b" font-size="9">目标 · 发现与决定 · 相关文件</text>
  <text x="296" y="210" fill="#64748b" font-size="9">剩余工作 · 用户约束</text>
  <text x="286" y="226" fill="#64748b" font-size="9">不提出、也不选择后续动作</text>

  <line x1="475" y1="178" x2="515" y2="178" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- C：替换历史 -->
  <rect x="520" y="120" width="180" height="116" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="610" y="144" fill="#5b21b6" font-size="12" font-weight="700" text-anchor="middle">C · 替换历史</text>
  <text x="610" y="166" fill="#5b21b6" font-size="10" text-anchor="middle">旧历史 → 1 条压缩消息</text>
  <text x="610" y="182" fill="#5b21b6" font-size="10" text-anchor="middle">当前请求与参考摘要分开</text>
  <text x="610" y="198" fill="#5b21b6" font-size="10" text-anchor="middle"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">system</tspan> 区分指令与数据</text>
  <text x="610" y="220" fill="#6d28d9" font-size="9" text-anchor="middle">完整 transcript 保留在磁盘</text>

  <!-- 压缩前 -->
  <rect x="20" y="250" width="320" height="100" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="180" y="272" fill="#64748b" font-size="11" font-weight="600" text-anchor="middle">压缩前的 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">messages</tspan></text>
  <rect x="30" y="284" width="56" height="18" rx="3" fill="#e2e8f0"/><text x="58" y="296" fill="#475569" font-size="9" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">user</text>
  <rect x="90" y="284" width="56" height="18" rx="3" fill="#e2e8f0"/><text x="118" y="296" fill="#475569" font-size="9" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">assistant</text>
  <rect x="150" y="284" width="56" height="18" rx="3" fill="#e2e8f0"/><text x="178" y="296" fill="#475569" font-size="9" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">user</text>
  <rect x="210" y="284" width="56" height="18" rx="3" fill="#e2e8f0"/><text x="238" y="296" fill="#475569" font-size="9" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">assistant</text>
  <rect x="270" y="284" width="56" height="18" rx="3" fill="#e2e8f0"/><text x="298" y="296" fill="#475569" font-size="9" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">user</text>
  <text x="180" y="328" fill="#64748b" font-size="9" text-anchor="middle">多条消息，估算大小 &gt; 50,000 字符</text>

  <line x1="345" y1="300" x2="375" y2="300" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- 压缩后 -->
  <rect x="380" y="250" width="320" height="100" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="540" y="272" fill="#5b21b6" font-size="11" font-weight="600" text-anchor="middle">压缩后的 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">messages</tspan></text>
  <rect x="395" y="280" width="290" height="46" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
  <text x="407" y="293" fill="#5b21b6" font-size="9" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">[Compacted]</text>
  <text x="407" y="307" fill="#5b21b6" font-size="9"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">Current user request</tspan> — 入口处捕获的当前请求</text>
  <text x="407" y="320" fill="#5b21b6" font-size="9"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">Conversation summary</tspan> — 事实、决定与剩余工作</text>
  <text x="540" y="340" fill="#6d28d9" font-size="9" text-anchor="middle">1 条摘要消息，大小显著低于阈值</text>

  <!-- 错误后补救 -->
  <rect x="20" y="362" width="680" height="36" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="35" y="384" fill="#991b1b" font-size="11" font-weight="600">错误后补救 (reactive fallback)：</text>
  <text x="212" y="384" fill="#991b1b" font-size="10">API 仍返回 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">prompt_too_long</tspan> 时执行 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">reactive_compact</tspan>，并且只重试 1 次</text>
</svg>
