<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 548" font-family="'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="820" height="548" fill="#fafbfc" rx="8"/>

  <!-- 标题栏 -->
  <rect x="0" y="0" width="820" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="820" height="8" fill="url(#header)"/>
  <rect x="0" y="45" width="820" height="3" fill="#00e75e"/>
  <text x="410" y="23" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">上下文压缩 — 每次调用大模型前先压缩，三种触发方式</text>
  <text x="410" y="40" fill="#b3b3b3" font-size="10" text-anchor="middle">Context Compact — compact before every LLM call, three triggers</text>

  <!-- 区域标签 -->
  <text x="30" y="70" fill="#64748b" font-size="11" font-weight="600">共同骨架 (shared core)</text>
  <text x="170" y="70" fill="#991b1b" font-size="11" font-weight="600">s08 新增 (new in s08)</text>

  <!-- ===== messages[] ===== -->
  <rect x="30" y="150" width="110" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="85" y="172" fill="#334155" font-size="12" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">messages[]</text>
  <text x="85" y="190" fill="#64748b" font-size="10" text-anchor="middle">消息列表（共同部分）</text>

  <!-- messages → 管线入口 -->
  <line x1="140" y1="176" x2="168" y2="176" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== 压缩管线（本章新增：红色虚线框） ===== -->
  <rect x="170" y="80" width="240" height="264" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="290" y="100" fill="#991b1b" font-size="12" font-weight="700" text-anchor="middle">压缩管线 (compaction pipeline)</text>

  <!-- ① 每轮自动 -->
  <rect x="184" y="110" width="212" height="18" rx="3" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
  <text x="290" y="123" fill="#92400e" font-size="9" font-weight="700" text-anchor="middle">① 每轮自动 · 无条件 · 0 次 API</text>

  <rect x="184" y="132" width="212" height="26" rx="4" fill="#fff7ed" stroke="#d97706" stroke-width="1"/>
  <text x="290" y="149" fill="#92400e" font-size="10" font-weight="600" text-anchor="middle">第 1 步 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">tool_result_budget</tspan></text>

  <rect x="184" y="162" width="212" height="26" rx="4" fill="#fff7ed" stroke="#d97706" stroke-width="1"/>
  <text x="290" y="179" fill="#92400e" font-size="10" font-weight="600" text-anchor="middle">第 2 步 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">snip_compact</tspan></text>

  <rect x="184" y="192" width="212" height="26" rx="4" fill="#fff7ed" stroke="#d97706" stroke-width="1"/>
  <text x="290" y="209" fill="#92400e" font-size="10" font-weight="600" text-anchor="middle">第 3 步 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">micro_compact</tspan></text>

  <!-- 第 3 步 → 判断 -->
  <line x1="290" y1="218" x2="290" y2="232" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 判断：估算超限？ -->
  <polygon points="290,234 334,252 290,270 246,252" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="290" y="256" fill="#92400e" font-size="9" font-weight="600" text-anchor="middle">估算超限？</text>

  <!-- 否：直接进大模型 -->
  <text x="342" y="249" fill="#16a34a" font-size="9" font-weight="700">否 → 通过</text>
  <text x="342" y="262" fill="#64748b" font-size="9">直接调用 LLM</text>

  <!-- 是：进入第 4 步 -->
  <line x1="290" y1="270" x2="290" y2="282" stroke="#d97706" stroke-width="1.2" marker-end="url(#arrow-amber)"/>
  <text x="298" y="281" fill="#d97706" font-size="9" font-weight="700">是</text>

  <!-- ② 条件触发 -->
  <rect x="184" y="284" width="212" height="18" rx="3" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="290" y="297" fill="#5b21b6" font-size="9" font-weight="700" text-anchor="middle">② 条件触发 · 大小超阈值 · 1 次 API</text>

  <rect x="184" y="306" width="212" height="26" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="290" y="323" fill="#5b21b6" font-size="10" font-weight="600" text-anchor="middle">第 4 步 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">compact_history</tspan></text>

  <!-- 管线出口 → 大模型 -->
  <line x1="410" y1="176" x2="448" y2="176" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- ===== 大模型 ===== -->
  <rect x="450" y="146" width="110" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="505" y="168" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">大模型 (LLM)</text>
  <line x1="462" y1="176" x2="548" y2="176" stroke="#e2e8f0" stroke-width="1"/>
  <text x="505" y="194" fill="#475569" font-size="10" text-anchor="middle">有 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">tool_use</tspan> 块？</text>

  <!-- 否 → 返回结果 -->
  <line x1="495" y1="206" x2="495" y2="290" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="501" y="258" fill="#16a34a" font-size="10" font-weight="600">否</text>
  <rect x="450" y="292" width="90" height="30" rx="15" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="495" y="311" fill="#166534" font-size="11" font-weight="600" text-anchor="middle">返回结果</text>

  <!-- 是 → TOOL_HANDLERS -->
  <line x1="560" y1="176" x2="588" y2="176" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="574" y="168" fill="#d97706" font-size="10" font-weight="600" text-anchor="middle">是</text>

  <!-- ===== TOOL_HANDLERS ===== -->
  <rect x="590" y="140" width="150" height="72" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="665" y="158" fill="#92400e" font-size="11" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">TOOL_HANDLERS</text>
  <text x="665" y="173" fill="#b45309" font-size="9" text-anchor="middle">工具处理函数表</text>
  <text x="665" y="189" fill="#b45309" font-size="9" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">bash · read · write</text>
  <text x="665" y="203" fill="#b45309" font-size="9" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">edit · glob · compact</text>

  <!-- 大模型 API 异常 → ③ 异常触发 -->
  <path d="M 545 206 L 545 268 L 588 268" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-red)"/>
  <text x="565" y="283" fill="#991b1b" font-size="9" font-weight="600" text-anchor="middle">API 异常</text>

  <!-- ===== ③ 异常触发 ===== -->
  <rect x="590" y="236" width="165" height="64" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="672" y="254" fill="#991b1b" font-size="10" font-weight="700" text-anchor="middle">③ 异常触发 (reactive)</text>
  <text x="672" y="270" fill="#b91c1c" font-size="9" text-anchor="middle">API 返回 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">prompt_too_long</tspan></text>
  <text x="672" y="286" fill="#b91c1c" font-size="9" text-anchor="middle">→ <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">reactive_compact</tspan> → 重试一次</text>

  <!-- ③ → 重试，回到压缩管线开头 -->
  <path d="M 672 300 L 672 358 L 156 358 L 156 145 L 182 145" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-red)"/>
  <text x="520" y="352" fill="#991b1b" font-size="9" font-weight="600" text-anchor="middle">重试：回到压缩管线开头</text>

  <!-- ===== 回环：工具结果 → messages[] ===== -->
  <path d="M 740 176 L 770 176 L 770 374 L 85 374 L 85 204" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="410" y="392" fill="#64748b" font-size="10" text-anchor="middle">工具结果追加到 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">messages[]</tspan> → 下一轮 → 再次压缩 → 大模型</text>

  <!-- ===== 图例 ===== -->
  <rect x="30" y="406" width="760" height="126" rx="6" fill="#f1f5f9"/>

  <rect x="50" y="413" width="16" height="12" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="74" y="423" fill="#334155" font-size="10">共同骨架 (shared core)：智能体循环、hook、权限检查、5 个基础工具</text>

  <rect x="50" y="435" width="16" height="12" rx="3" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
  <text x="74" y="445" fill="#334155" font-size="10">① 每轮自动 (every turn)：每次调用大模型前依次执行第 1 → 2 → 3 步，0 次 API</text>

  <rect x="50" y="457" width="16" height="12" rx="3" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="74" y="467" fill="#334155" font-size="10">② 条件触发 (threshold)：前三步后估算大小仍超阈值 → <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">compact_history</tspan>，1 次 API</text>

  <rect x="50" y="479" width="16" height="12" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="74" y="489" fill="#334155" font-size="10">③ 异常触发 (on API error)：API 返回 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">prompt_too_long</tspan> → <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">reactive_compact</tspan> → 重试一次</text>

  <line x1="50" y1="502" x2="770" y2="502" stroke="#e2e8f0" stroke-width="1"/>
  <text x="50" y="520" fill="#64748b" font-size="9">三种方式成本逐级增加：0 次 API → 1 次摘要 → 1 次摘要 + 重试。红色虚线框 = s08 新增 (new in s08)。</text>
</svg>
