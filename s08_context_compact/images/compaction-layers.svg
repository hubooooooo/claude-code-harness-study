<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" font-family="'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="760" height="590" fill="#fafbfc" rx="8"/>

  <!-- 标题栏 -->
  <rect x="0" y="0" width="760" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="760" height="8" fill="url(#header)"/>
  <text x="380" y="23" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">上下文压缩：四步管线与 API 拒绝后的补救</text>
  <text x="380" y="40" fill="#bfdbfe" font-size="10" text-anchor="middle">Context Compact — four-step pipeline and the fallback after an API rejection</text>

  <!-- 左侧：设计原则 -->
  <rect x="20" y="62" width="230" height="86" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="135" y="82" fill="#1e3a5f" font-size="12" font-weight="700" text-anchor="middle">设计原则 (design principles)</text>
  <text x="135" y="102" fill="#475569" font-size="10" text-anchor="middle">低成本的处理优先执行</text>
  <text x="135" y="118" fill="#475569" font-size="10" text-anchor="middle">可恢复的信息优先保留</text>
  <text x="135" y="134" fill="#475569" font-size="10" text-anchor="middle">整理后仍超限才生成摘要</text>

  <!-- 右侧：代价递增 -->
  <rect x="510" y="62" width="230" height="86" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="625" y="82" fill="#1e3a5f" font-size="12" font-weight="700" text-anchor="middle">代价递增 (cost increases)</text>
  <text x="625" y="102" fill="#475569" font-size="10" text-anchor="middle">结构整理 → 历史摘要 → 错误后补救</text>
  <text x="625" y="117" fill="#64748b" font-size="9" text-anchor="middle">restructure → summarize → reactive fallback</text>
  <text x="625" y="136" fill="#64748b" font-size="9" text-anchor="middle">3 × 0 次 API · 1 次 API · 最多再 1 次 API</text>

  <!-- ===== 分组 1：预处理管线 ===== -->
  <rect x="20" y="158" width="720" height="24" rx="4" fill="#f1f5f9"/>
  <text x="36" y="175" fill="#64748b" font-size="11" font-weight="600">预处理管线 (pre-processing)：第 1 → 2 → 3 步，每次调用大模型前执行，0 次 API</text>

  <!-- 第 1 步：tool_result_budget -->
  <rect x="80" y="190" width="600" height="46" rx="7" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="96" y="210" fill="#92400e" font-size="12" font-weight="700">第 1 步</text>
  <text x="96" y="226" fill="#b45309" font-size="9">Step 1</text>
  <text x="155" y="210" fill="#92400e" font-size="13" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">tool_result_budget</text>
  <text x="310" y="210" fill="#92400e" font-size="11">总和 &gt; 200,000 字符 → 最大项转存磁盘</text>
  <text x="664" y="210" fill="#92400e" font-size="10" font-weight="600" text-anchor="end">大结果转存</text>
  <text x="155" y="227" fill="#b45309" font-size="10">每轮执行；在 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">micro_compact</tspan> 之前先把超大结果完整保存</text>

  <!-- 第 1 步 → 第 2 步 -->
  <line x1="380" y1="236" x2="380" y2="248" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 第 2 步：snip_compact -->
  <rect x="80" y="250" width="600" height="46" rx="7" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="96" y="270" fill="#92400e" font-size="12" font-weight="700">第 2 步</text>
  <text x="96" y="286" fill="#b45309" font-size="9">Step 2</text>
  <text x="155" y="270" fill="#92400e" font-size="13" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">snip_compact</text>
  <text x="265" y="270" fill="#92400e" font-size="11">消息 &gt; 50 条 → 裁掉中间历史</text>
  <text x="664" y="270" fill="#92400e" font-size="10" font-weight="600" text-anchor="end">保留头尾</text>
  <text x="155" y="287" fill="#b45309" font-size="10">消息超过 50 条时裁剪，并保护 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">tool_use</tspan> 与 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">tool_result</tspan> 的配对</text>

  <!-- 第 2 步 → 第 3 步 -->
  <line x1="380" y1="296" x2="380" y2="308" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 第 3 步：micro_compact -->
  <rect x="80" y="310" width="600" height="46" rx="7" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="96" y="330" fill="#92400e" font-size="12" font-weight="700">第 3 步</text>
  <text x="96" y="346" fill="#b45309" font-size="9">Step 3</text>
  <text x="155" y="330" fill="#92400e" font-size="13" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">micro_compact</text>
  <text x="270" y="330" fill="#92400e" font-size="11">旧 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">tool_result</tspan> → 占位符（保留最近 3 条）</text>
  <text x="664" y="330" fill="#92400e" font-size="10" font-weight="600" text-anchor="end">旧结果占位</text>
  <text x="155" y="347" fill="#b45309" font-size="10">每轮执行；新结果和最近 3 条已读结果保持完整</text>

  <!-- ===== 分组 2：自动压缩 ===== -->
  <rect x="20" y="368" width="720" height="24" rx="4" fill="#f1f5f9"/>
  <text x="36" y="385" fill="#64748b" font-size="11" font-weight="600">自动压缩 (auto compact)：前三步后仍超阈值才触发，1 次 API 调用</text>

  <!-- 第 4 步：compact_history -->
  <rect x="80" y="400" width="600" height="60" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="96" y="420" fill="#5b21b6" font-size="12" font-weight="700">第 4 步</text>
  <text x="96" y="436" fill="#6d28d9" font-size="9">Step 4</text>
  <text x="155" y="420" fill="#5b21b6" font-size="13" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">compact_history</text>
  <text x="290" y="420" fill="#5b21b6" font-size="11">大小 &gt; 50,000 字符 → 大模型生成摘要</text>
  <text x="664" y="420" fill="#5b21b6" font-size="10" font-weight="600" text-anchor="end">1 次 API 调用</text>
  <text x="155" y="438" fill="#6d28d9" font-size="9">条件：<tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">estimate_chars(messages) &gt; CONTEXT_CHAR_LIMIT</tspan></text>
  <text x="155" y="452" fill="#6d28d9" font-size="9">先保存 transcript，再用一条摘要消息替换当前历史</text>

  <!-- ===== 分组 3：错误后补救 ===== -->
  <rect x="20" y="472" width="720" height="24" rx="4" fill="#f1f5f9"/>
  <text x="36" y="489" fill="#64748b" font-size="11" font-weight="600">错误后补救 (reactive fallback)：API 返回 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">prompt_too_long</tspan> 时触发，最多一次</text>

  <!-- 补救：reactive_compact -->
  <rect x="80" y="504" width="600" height="60" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="96" y="524" fill="#991b1b" font-size="12" font-weight="700">补救</text>
  <text x="96" y="540" fill="#b91c1c" font-size="9">Fallback</text>
  <text x="155" y="524" fill="#991b1b" font-size="13" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">reactive_compact</text>
  <text x="155" y="541" fill="#991b1b" font-size="10">总结较早历史，保留最近 5 条消息</text>
  <text x="155" y="556" fill="#b91c1c" font-size="9">保持工具调用与结果的配对，随后重试一次</text>
</svg>
