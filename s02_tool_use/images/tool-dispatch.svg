<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" font-family="'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="720" height="560" fill="#fafbfc" rx="8"/>

  <!-- 标题栏 -->
  <rect x="0" y="0" width="720" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="23" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">工具调用 — 循环不变，只加一张分发映射表</text>
  <text x="360" y="40" fill="#bfdbfe" font-size="10" text-anchor="middle">Tool Use — the loop stays the same, only a dispatch map is added</text>

  <!-- ===== s01 保留 ===== -->
  <text x="50" y="74" fill="#94a3b8" font-size="11" font-weight="600">s01 保留</text>

  <!-- 用户输入 -->
  <rect x="60" y="86" width="140" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="130" y="105" fill="#1e3a5f" font-size="12" font-weight="600" text-anchor="middle">用户提问 (User)</text>
  <text x="130" y="121" fill="#475569" font-size="10" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">messages[]</text>

  <!-- 箭头：用户 → LLM -->
  <line x1="200" y1="108" x2="268" y2="108" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- LLM -->
  <rect x="270" y="82" width="150" height="52" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="345" y="104" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">大模型 (LLM)</text>
  <text x="345" y="122" fill="#475569" font-size="10" text-anchor="middle">检查 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">tool_use</tspan> 块</text>

  <!-- 箭头：LLM → 判断 -->
  <line x1="345" y1="134" x2="345" y2="162" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 判断菱形 -->
  <polygon points="345,166 415,196 345,226 275,196" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="345" y="193" fill="#92400e" font-size="11" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">tool_use</text>
  <text x="345" y="207" fill="#92400e" font-size="10" text-anchor="middle">块存在？</text>

  <!-- 否 → 返回 -->
  <line x1="415" y1="196" x2="475" y2="196" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="445" y="189" fill="#16a34a" font-size="10" font-weight="600" text-anchor="middle">否</text>
  <rect x="477" y="176" width="124" height="40" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="539" y="193" fill="#166534" font-size="11" font-weight="600" text-anchor="middle">返回结果</text>
  <text x="539" y="207" fill="#15803d" font-size="9" text-anchor="middle">循环结束 (end_turn)</text>

  <!-- 是 → 下一步 -->
  <line x1="345" y1="226" x2="345" y2="266" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="356" y="250" fill="#d97706" font-size="10" font-weight="600">是</text>

  <!-- ===== s02 新增：TOOL_HANDLERS 分发映射 ===== -->
  <text x="503" y="282" fill="#dc2626" font-size="11" font-weight="600">s02 新增</text>

  <!-- 分发映射外框 -->
  <rect x="195" y="268" width="300" height="200" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="345" y="290" fill="#991b1b" font-size="12" font-weight="700" text-anchor="middle"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">TOOL_HANDLERS</tspan> 分发映射 (dispatch map)</text>

  <!-- bash handler（s01 已有） -->
  <rect x="220" y="300" width="120" height="34" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="280" y="315" fill="#92400e" font-size="11" font-weight="600" text-anchor="middle"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">bash</tspan><tspan fill="#64748b" font-size="9" font-weight="400"> (s01 已有)</tspan></text>
  <text x="280" y="328" fill="#b45309" font-size="9" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">→ run_bash()</text>

  <!-- read_file handler -->
  <rect x="360" y="300" width="120" height="34" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="1.2"/>
  <text x="420" y="315" fill="#92400e" font-size="11" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">read_file</text>
  <text x="420" y="328" fill="#b45309" font-size="9" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">→ run_read()</text>

  <!-- write_file handler -->
  <rect x="220" y="346" width="120" height="34" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="1.2"/>
  <text x="280" y="361" fill="#92400e" font-size="11" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">write_file</text>
  <text x="280" y="374" fill="#b45309" font-size="9" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">→ run_write()</text>

  <!-- edit_file handler -->
  <rect x="360" y="346" width="120" height="34" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="1.2"/>
  <text x="420" y="361" fill="#92400e" font-size="11" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">edit_file</text>
  <text x="420" y="374" fill="#b45309" font-size="9" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">→ run_edit()</text>

  <!-- glob handler -->
  <rect x="290" y="392" width="120" height="34" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="1.2"/>
  <text x="350" y="407" fill="#92400e" font-size="11" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">glob</text>
  <text x="350" y="420" fill="#b45309" font-size="9" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">→ run_glob()</text>

  <!-- 分发说明 -->
  <text x="345" y="452" fill="#b91c1c" font-size="10" text-anchor="middle">按 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">block.name</tspan> 查表，调用对应处理函数</text>

  <!-- 箭头：分发映射 → 回到消息列表 -->
  <path d="M 195 368 L 50 368 L 50 108 L 58 108" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-amber)" stroke-dasharray="6,3"/>
  <text x="40" y="318" fill="#92400e" font-size="10" font-weight="600" transform="rotate(-90, 40, 318)">把 tool_result 追加进 messages</text>

  <!-- ===== 图例 ===== -->
  <rect x="60" y="490" width="600" height="54" rx="6" fill="#f1f5f9"/>
  <rect x="80" y="503" width="12" height="12" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="100" y="513" fill="#334155" font-size="10">s01 保留（循环、LLM、判断——完全不变）</text>
  <rect x="380" y="503" width="12" height="12" rx="2" fill="#fef2f2" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="400" y="513" fill="#334155" font-size="10">s02 新增（分发映射，工具从 1 个扩到 5 个）</text>
  <text x="80" y="533" fill="#64748b" font-size="10">循环里只改了 1 行：<tspan fill="#1e3a5f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">run_bash()</tspan> → <tspan fill="#1e3a5f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">TOOL_HANDLERS[block.name]()</tspan></text>
</svg>
