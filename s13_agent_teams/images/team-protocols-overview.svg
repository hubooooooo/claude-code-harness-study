<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 734" font-family="'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="760" height="734" fill="#fafbfc" rx="8"/>

  <!-- 标题栏 -->
  <rect x="0" y="0" width="760" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="760" height="8" fill="url(#header)"/>
  <rect x="0" y="45" width="760" height="3" fill="#00e75e"/>
  <text x="380" y="23" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">团队协议 — 请求-响应协议 + request_id 关联 + 状态机</text>
  <text x="380" y="40" fill="#b3b3b3" font-size="10" text-anchor="middle">Team Protocols — request/response + request_id correlation + one state machine</text>

  <!-- 图例 -->
  <rect x="40" y="58" width="12" height="10" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="58" y="67" fill="#2563eb" font-size="10" font-weight="600">团队运行时 (Team Runtime)</text>
  <rect x="210" y="58" width="12" height="10" rx="2" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="228" y="67" fill="#7c3aed" font-size="10" font-weight="600">协作协议 (Protocols)</text>

  <!-- ===== 第 1 行：主控 Agent 循环 ===== -->
  <rect x="20" y="84" width="70" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="55" y="105" fill="#1e3a5f" font-size="11" font-weight="600" text-anchor="middle">新一轮</text>
  <text x="55" y="121" fill="#64748b" font-size="9" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">turn</text>
  <line x1="90" y1="108" x2="102" y2="108" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="104" y="84" width="78" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="143" y="105" fill="#1e3a5f" font-size="11" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">messages</text>
  <text x="143" y="121" fill="#64748b" font-size="9" text-anchor="middle">消息列表</text>
  <line x1="182" y1="108" x2="194" y2="108" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="196" y="84" width="82" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="237" y="105" fill="#1e3a5f" font-size="11" font-weight="600" text-anchor="middle">系统提示词</text>
  <text x="237" y="121" fill="#64748b" font-size="9" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">prompt</text>
  <line x1="278" y1="108" x2="290" y2="108" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="292" y="84" width="70" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="327" y="105" fill="#1e3a5f" font-size="11" font-weight="600" text-anchor="middle">大模型</text>
  <text x="327" y="121" fill="#64748b" font-size="9" text-anchor="middle">(LLM)</text>
  <line x1="362" y1="108" x2="374" y2="108" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="376" y="78" width="358" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="555" y="96" fill="#1e3a5f" font-size="11" font-weight="700" text-anchor="middle">工具分发 (Tool Dispatch) · 核心工具集</text>
  <text x="392" y="114" fill="#2563eb" font-size="10">基础工具 (5) · <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">task</tspan> (5) · <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">team</tspan> (7)</text>
  <text x="392" y="130" fill="#7c3aed" font-size="10" font-weight="700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">★ request_shutdown · request_plan · review_plan</text>
  <path d="M 734 108 L 748 108 L 748 150 L 55 150 L 55 132" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- ===== 第 2 行：协议 A shutdown ===== -->
  <rect x="30" y="164" width="700" height="104" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="380" y="184" fill="#92400e" font-size="12" font-weight="700" text-anchor="middle">协议 A：关机流程 shutdown（主控 Agent 发起 → 队友响应）</text>

  <rect x="50" y="198" width="200" height="58" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
  <text x="150" y="214" fill="#92400e" font-size="10" font-weight="600" text-anchor="middle">① 主控 Agent (Lead)</text>
  <text x="150" y="230" fill="#92400e" font-size="10" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">request_shutdown</text>
  <text x="150" y="246" fill="#64748b" font-size="9" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">new_request_id() → ProtocolState</text>

  <line x1="250" y1="227" x2="278" y2="227" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <rect x="280" y="198" width="200" height="58" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
  <text x="380" y="214" fill="#92400e" font-size="10" font-weight="600" text-anchor="middle">② 队友 (Teammate)</text>
  <text x="380" y="230" fill="#92400e" font-size="10" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">handle_shutdown</text>
  <text x="380" y="246" fill="#64748b" font-size="9" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">ack → shutdown_response</text>

  <line x1="480" y1="227" x2="508" y2="227" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <rect x="510" y="198" width="200" height="58" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
  <text x="610" y="214" fill="#92400e" font-size="10" font-weight="600" text-anchor="middle">③ 主控 Agent (Lead)</text>
  <text x="610" y="230" fill="#92400e" font-size="10" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">consume_lead_inbox</text>
  <text x="610" y="246" fill="#64748b" font-size="9" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">match_response(request_id) → ✓</text>

  <!-- ===== 第 3 行：协议 B plan approval ===== -->
  <rect x="30" y="282" width="700" height="122" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="380" y="302" fill="#1e3a5f" font-size="12" font-weight="700" text-anchor="middle">协议 B：计划审批 plan approval（队友发起 → 主控 Agent 审批）</text>

  <rect x="40" y="316" width="120" height="58" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="100" y="332" fill="#334155" font-size="10" font-weight="600" text-anchor="middle">0. 主控 Agent</text>
  <text x="100" y="348" fill="#475569" font-size="10" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">request_plan</text>
  <text x="100" y="364" fill="#64748b" font-size="9" text-anchor="middle">发出 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">plan_request</tspan></text>

  <line x1="160" y1="345" x2="178" y2="345" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <rect x="180" y="316" width="200" height="58" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="280" y="332" fill="#1e3a5f" font-size="10" font-weight="600" text-anchor="middle">① 队友 (Teammate)</text>
  <text x="280" y="348" fill="#1e3a5f" font-size="10" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">submit_plan</text>
  <text x="280" y="364" fill="#64748b" font-size="9" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">plan_approval_request + request_id</text>

  <line x1="380" y1="345" x2="398" y2="345" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <rect x="400" y="316" width="150" height="58" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="475" y="332" fill="#1e3a5f" font-size="10" font-weight="600" text-anchor="middle">② 主控 Agent (Lead)</text>
  <text x="475" y="348" fill="#1e3a5f" font-size="10" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">review_plan</text>
  <text x="475" y="364" fill="#64748b" font-size="9" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">plan_approval_response</text>

  <line x1="550" y1="345" x2="568" y2="345" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <rect x="570" y="316" width="150" height="58" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="645" y="332" fill="#1e3a5f" font-size="10" font-weight="600" text-anchor="middle">③ 队友 (Teammate)</text>
  <text x="645" y="348" fill="#1e3a5f" font-size="10" font-weight="700" text-anchor="middle">收到审批结果</text>
  <text x="645" y="364" fill="#64748b" font-size="9" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">[Plan approved/rejected]</text>

  <text x="380" y="393" fill="#64748b" font-size="10" text-anchor="middle"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">request_plan</tspan> 发出要求；<tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">submit_plan</tspan> 创建可审批的 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">ProtocolState</tspan></text>

  <!-- ===== 第 4 行：状态机 + 存储 ===== -->
  <rect x="30" y="418" width="340" height="100" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="200" y="438" fill="#5b21b6" font-size="11" font-weight="700" text-anchor="middle">状态机 (State Machine) · 两种协议共用同一套</text>

  <rect x="50" y="452" width="66" height="22" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="83" y="467" fill="#475569" font-size="10" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">pending</text>
  <line x1="116" y1="463" x2="212" y2="463" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="164" y="457" fill="#16a34a" font-size="10" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">approve</text>
  <rect x="214" y="452" width="76" height="22" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="252" y="467" fill="#166534" font-size="10" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">approved</text>
  <path d="M 83 474 L 83 494 L 140 494" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="76" y="492" fill="#dc2626" font-size="10" font-weight="600" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">reject</text>
  <rect x="142" y="483" width="76" height="22" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="180" y="498" fill="#991b1b" font-size="10" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">rejected</text>

  <rect x="400" y="418" width="330" height="100" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="565" y="438" fill="#5b21b6" font-size="11" font-weight="700" text-anchor="middle"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">pending_requests</tspan> 存储 (storage)</text>
  <text x="418" y="460" fill="#6d28d9" font-size="10" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">pending_requests: dict[str, ProtocolState]</text>
  <text x="418" y="479" fill="#64748b" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">request_id → {type, sender, status, created_at}</text>
  <text x="418" y="499" fill="#64748b" font-size="10"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">match_response</tspan>：按 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">request_id</tspan> 找回对应请求</text>

  <!-- ===== 第 5 行：两种协议，同一套机制 ===== -->
  <rect x="30" y="532" width="700" height="70" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="50" y="555" fill="#1e3a5f" font-size="11" font-weight="600">两种协议，同一套机制：</text>
  <rect x="184" y="541" width="134" height="20" rx="4" fill="#fff7ed" stroke="#d97706" stroke-width="1"/>
  <text x="251" y="555" fill="#92400e" font-size="10" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">shutdown_request</text>
  <text x="332" y="555" fill="#475569" font-size="10" text-anchor="middle">和</text>
  <rect x="346" y="541" width="162" height="20" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="427" y="555" fill="#1e3a5f" font-size="10" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">plan_approval_request</text>
  <text x="50" y="578" fill="#475569" font-size="10">共用 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">pending → approved / rejected</tspan> 状态机。新增协议类型 = 新的 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">msg_type</tspan>，不需要新状态机。</text>
  <text x="50" y="594" fill="#475569" font-size="10"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">request_id</tspan> 把响应关联回对应的请求。</text>

  <!-- ===== 第 6 行：区分 ===== -->
  <rect x="30" y="614" width="700" height="64" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="50" y="633" fill="#166534" font-size="10" font-weight="700">区分：</text>
  <text x="86" y="633" fill="#475569" font-size="10"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">request_plan</tspan> 发送 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">plan_request</tspan>；<tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">submit_plan</tspan> 生成 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">request_id</tspan> 并等待审批。</text>
  <text x="86" y="650" fill="#475569" font-size="10"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">submit_plan</tspan> 才是协议入口（<tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">msg_type="plan_approval_request"</tspan>），由队友主动发起，</text>
  <text x="86" y="667" fill="#475569" font-size="10">携带 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">request_id</tspan> 写入 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">pending_requests</tspan>。</text>

  <!-- 底部图例 -->
  <rect x="30" y="692" width="700" height="28" rx="6" fill="#f1f5f9"/>
  <rect x="50" y="701" width="12" height="10" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="68" y="710" fill="#475569" font-size="10">运行时：<tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">MessageBus</tspan> + 持久队友 + 自动事件投递</text>
  <rect x="340" y="701" width="12" height="10" rx="2" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="358" y="710" fill="#475569" font-size="10">协议：<tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">request_id</tspan> + 分发 (dispatch) + <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">pending_requests</tspan> + 计划闸门</text>
</svg>
