<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 418" font-family="'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="760" height="418" fill="#fafbfc" rx="8"/>

  <!-- 标题栏 -->
  <rect x="0" y="0" width="760" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="760" height="8" fill="url(#header)"/>
  <text x="380" y="23" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">任务依赖图 — 示例：搭数据库 → API → 测试 → 部署</text>
  <text x="380" y="40" fill="#bfdbfe" font-size="10" text-anchor="middle">Task DAG — dependency example: schema → endpoints → tests → deploy</text>

  <!-- 第 1 行：schema（已完成） -->
  <rect x="295" y="64" width="170" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="84" fill="#166534" font-size="12" font-weight="700" text-anchor="middle"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">✓ schema</tspan><tspan font-size="11" font-weight="400" fill="#15803d" dx="6">数据库表</tspan></text>
  <text x="380" y="101" fill="#15803d" font-size="10" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">completed</text>
  <text x="380" y="116" fill="#15803d" font-size="9" text-anchor="middle">已完成</text>

  <!-- 箭头：schema → endpoints, schema → docs -->
  <path d="M 340 124 L 240 162" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 420 124 L 520 162" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 第 2 行：endpoints（进行中）、docs（待处理） -->
  <rect x="115" y="164" width="170" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="184" fill="#1e3a5f" font-size="12" font-weight="700" text-anchor="middle"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">● endpoints</tspan><tspan font-size="11" font-weight="400" fill="#475569" dx="6">API 接口</tspan></text>
  <text x="200" y="201" fill="#2563eb" font-size="9" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">in_progress · owner: agent-1</text>
  <text x="200" y="216" fill="#475569" font-size="9" text-anchor="middle">进行中，已被 agent-1 认领</text>

  <rect x="468" y="164" width="184" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="560" y="184" fill="#334155" font-size="12" font-weight="700" text-anchor="middle"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">○ docs</tspan><tspan font-size="11" font-weight="400" fill="#64748b" dx="6">文档</tspan></text>
  <text x="560" y="201" fill="#64748b" font-size="9" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">pending · blockedBy: schema ✓</text>
  <text x="560" y="216" fill="#64748b" font-size="9" text-anchor="middle">待处理，前置已完成</text>

  <!-- 箭头：endpoints → tests, docs → deploy -->
  <path d="M 200 224 L 200 262" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 510 224 L 440 262" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 第 3 行：tests（待处理）、deploy（待处理） -->
  <rect x="115" y="264" width="170" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="200" y="284" fill="#334155" font-size="12" font-weight="700" text-anchor="middle"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">○ tests</tspan><tspan font-size="11" font-weight="400" fill="#64748b" dx="6">测试</tspan></text>
  <text x="200" y="301" fill="#64748b" font-size="9" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">blockedBy: endpoints ●</text>
  <text x="200" y="316" fill="#64748b" font-size="9" text-anchor="middle">待处理，等 endpoints 完成</text>

  <!-- 箭头：tests → deploy -->
  <path d="M 285 294 L 373 294" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="375" y="264" width="170" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="460" y="284" fill="#334155" font-size="12" font-weight="700" text-anchor="middle"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">○ deploy</tspan><tspan font-size="11" font-weight="400" fill="#64748b" dx="6">部署</tspan></text>
  <text x="460" y="301" fill="#64748b" font-size="9" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">blockedBy: tests, docs</text>
  <text x="460" y="316" fill="#64748b" font-size="9" text-anchor="middle">待处理，等 tests 和 docs 完成</text>

  <!-- 图例 -->
  <rect x="40" y="344" width="680" height="56" rx="6" fill="#f1f5f9"/>
  <rect x="60" y="355" width="14" height="12" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="80" y="365" fill="#334155" font-size="10"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">completed</tspan> 已完成</text>
  <rect x="180" y="355" width="14" height="12" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="200" y="365" fill="#334155" font-size="10"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">in_progress</tspan> 进行中</text>
  <rect x="315" y="355" width="14" height="12" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="335" y="365" fill="#334155" font-size="10"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">pending</tspan> 待处理</text>
  <line x1="440" y1="361" x2="468" y2="361" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="476" y="365" fill="#64748b" font-size="10"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">blockedBy</tspan> 依赖（箭头 = 依赖方向）</text>
  <text x="60" y="388" fill="#64748b" font-size="10"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">docs</tspan> 的 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">blockedBy (schema)</tspan> 已完成 → <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">can_start</tspan> 返回 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">True</tspan>，可被 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">claim</tspan> 认领</text>
</svg>
