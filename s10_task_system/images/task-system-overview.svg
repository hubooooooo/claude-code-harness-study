<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 462" font-family="'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="760" height="462" fill="#fafbfc" rx="8"/>

  <!-- 标题栏 -->
  <rect x="0" y="0" width="760" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="760" height="8" fill="url(#header)"/>
  <text x="380" y="23" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">任务系统 — 6 个任务工具 + <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">.tasks/</tspan> 持久化 + <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">blockedBy</tspan> 依赖</text>
  <text x="380" y="40" fill="#bfdbfe" font-size="10" text-anchor="middle">Task System — 6 task tools + .tasks/ persistence + blockedBy dependencies</text>

  <!-- 图例 -->
  <rect x="40" y="60" width="12" height="10" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="58" y="69" fill="#1e3a5f" font-size="10" font-weight="600">基础循环 (base loop)</text>
  <rect x="180" y="60" width="12" height="10" rx="2" fill="#fff7ed" stroke="#d97706" stroke-width="1"/>
  <text x="198" y="69" fill="#92400e" font-size="10" font-weight="600">工具执行 (Tool)</text>
  <rect x="300" y="60" width="12" height="10" rx="2" fill="#fef2f2" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="318" y="69" fill="#991b1b" font-size="10" font-weight="600">s10 新增</text>

  <!-- ===== 基础循环（精简） ===== -->
  <rect x="30" y="92" width="90" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="75" y="115" fill="#334155" font-size="11" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">messages[]</text>
  <text x="75" y="132" fill="#64748b" font-size="10" text-anchor="middle">消息列表</text>

  <line x1="120" y1="118" x2="138" y2="118" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="140" y="90" width="110" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="195" y="109" fill="#1e3a5f" font-size="12" font-weight="600" text-anchor="middle">系统提示词</text>
  <text x="195" y="123" fill="#64748b" font-size="9" text-anchor="middle">(system prompt)</text>
  <text x="195" y="138" fill="#475569" font-size="10" text-anchor="middle">固定指令</text>

  <line x1="250" y1="118" x2="268" y2="118" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="270" y="90" width="100" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="320" y="109" fill="#1e3a5f" font-size="12" font-weight="600" text-anchor="middle">大模型调用</text>
  <text x="320" y="123" fill="#64748b" font-size="9" text-anchor="middle">(LLM call)</text>
  <text x="320" y="138" fill="#475569" font-size="10" text-anchor="middle">发送模型请求</text>

  <line x1="370" y1="118" x2="388" y2="118" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 工具（展开） -->
  <rect x="390" y="76" width="270" height="88" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="525" y="93" fill="#92400e" font-size="11" font-weight="600" text-anchor="middle">钩子 (Hooks) + <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">TOOL_HANDLERS</tspan></text>
  <text x="525" y="109" fill="#b45309" font-size="10" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">bash · read · write · edit · glob</text>
  <rect x="400" y="116" width="250" height="40" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="525" y="132" fill="#991b1b" font-size="10" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">create_task · update_task · list_tasks</text>
  <text x="525" y="148" fill="#991b1b" font-size="10" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">get_task · claim_task · complete_task</text>

  <!-- 回环：工具结果回到 messages -->
  <path d="M 660 118 L 690 118 L 690 180 L 75 180 L 75 146" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6,3"/>

  <!-- 箭头：任务工具 → .tasks/ -->
  <path d="M 440 164 L 440 198 L 250 198 L 250 220" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="260" y="213" fill="#b91c1c" font-size="9"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">create_task</tspan> → 生成 ID · <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">update_task</tspan> → 加依赖边 · 读取</text>

  <!-- ===== .tasks/ 目录（s10 新增） ===== -->
  <rect x="40" y="222" width="310" height="84" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="195" y="242" fill="#991b1b" font-size="12" font-weight="700" text-anchor="middle"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">.tasks/</tspan> — 跨会话持久化</text>
  <text x="56" y="261" fill="#b91c1c" font-size="10" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">task_xxx.json · task_yyy.json · task_zzz.json</text>
  <text x="56" y="277" fill="#64748b" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">{id, subject, description, status, owner, blockedBy}</text>
  <text x="56" y="294" fill="#64748b" font-size="9">ID：<tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">task_</tspan> + 8 位随机十六进制字符</text>

  <!-- ===== 依赖检查 + 生命周期（s10 新增） ===== -->
  <rect x="390" y="222" width="330" height="84" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="555" y="242" fill="#991b1b" font-size="12" font-weight="700" text-anchor="middle">依赖检查 + 生命周期</text>
  <text x="406" y="261" fill="#b91c1c" font-size="10"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">create_task</tspan> → 运行时 ID；<tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">update_task</tspan> → <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">blockedBy</tspan></text>
  <text x="406" y="277" fill="#b91c1c" font-size="10"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">can_start</tspan> + <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">claim</tspan>：依赖是否全部 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">completed</tspan>？</text>
  <text x="406" y="293" fill="#b91c1c" font-size="10"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">complete_task</tspan> → <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">completed</tspan> + 解锁下游任务</text>

  <!-- ===== 状态机 ===== -->
  <rect x="40" y="322" width="680" height="54" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="56" y="345" fill="#1e3a5f" font-size="11" font-weight="600">状态机：</text>

  <rect x="116" y="331" width="64" height="20" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="148" y="345" fill="#475569" font-size="10" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">pending</text>
  <text x="148" y="367" fill="#64748b" font-size="9" text-anchor="middle">待处理</text>

  <line x1="180" y1="341" x2="250" y2="341" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="215" y="336" fill="#2563eb" font-size="9" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">claim</text>
  <text x="215" y="354" fill="#475569" font-size="9" text-anchor="middle">认领</text>

  <rect x="252" y="331" width="86" height="20" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="295" y="345" fill="#1e3a5f" font-size="10" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">in_progress</text>
  <text x="295" y="367" fill="#475569" font-size="9" text-anchor="middle">进行中</text>

  <line x1="338" y1="341" x2="426" y2="341" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="382" y="336" fill="#16a34a" font-size="9" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">complete_task</text>
  <text x="382" y="354" fill="#15803d" font-size="9" text-anchor="middle">完成</text>

  <rect x="428" y="331" width="76" height="20" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="466" y="345" fill="#166534" font-size="10" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">completed</text>
  <text x="466" y="367" fill="#15803d" font-size="9" text-anchor="middle">已完成</text>

  <text x="522" y="345" fill="#64748b" font-size="9"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">complete_task</tspan> 检查 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">status</tspan> 和 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">owner</tspan></text>

  <!-- ===== 底部要点 ===== -->
  <rect x="40" y="392" width="680" height="54" rx="6" fill="#f1f5f9"/>
  <rect x="60" y="406" width="12" height="10" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="80" y="415" fill="#334155" font-size="10">基础循环：模型调用 + 权限 (Permission) / 钩子 (Hooks) + 工具分发 + <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">tool_result</tspan></text>
  <rect x="60" y="425" width="12" height="10" rx="2" fill="#fef2f2" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="80" y="434" fill="#334155" font-size="10">s10 新增：<tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">Task</tspan> 数据类 (dataclass) + 6 个任务工具 + <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">.tasks/</tspan> 持久化 + <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">blockedBy</tspan> 依赖图</text>
</svg>
