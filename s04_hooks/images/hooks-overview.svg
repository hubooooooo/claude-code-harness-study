<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 476" font-family="'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="476" fill="#fafbfc" rx="8"/>

  <!-- 标题栏 -->
  <rect x="0" y="0" width="800" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="800" height="8" fill="url(#header)"/>
  <rect x="0" y="45" width="800" height="3" fill="#00e75e"/>
  <text x="400" y="23" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">钩子 — 扩展逻辑挂在外面，循环本身一字不改</text>
  <text x="400" y="40" fill="#b3b3b3" font-size="10" text-anchor="middle">Hooks — extensions hang outside the loop; the loop itself stays unchanged</text>

  <!-- ===== 主流程线（y=140 水平） ===== -->

  <!-- ① messages[] -->
  <rect x="40" y="112" width="110" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="95" y="136" fill="#334155" font-size="12" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">messages[]</text>
  <text x="95" y="154" fill="#64748b" font-size="9" text-anchor="middle">消息列表 (s01 保留)</text>

  <!-- → LLM -->
  <line x1="150" y1="140" x2="198" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- ② LLM -->
  <rect x="200" y="108" width="120" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="260" y="134" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">大模型 (LLM)</text>
  <text x="260" y="154" fill="#475569" font-size="10" text-anchor="middle"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">tool_use</tspan> 块？</text>

  <!-- LLM 否 → 返回 -->
  <line x1="260" y1="172" x2="260" y2="200" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="272" y="191" fill="#16a34a" font-size="10" font-weight="600">否</text>
  <rect x="205" y="202" width="110" height="28" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="260" y="220" fill="#166534" font-size="11" font-weight="600" text-anchor="middle">返回结果</text>

  <!-- LLM 是 → PreToolUse -->
  <line x1="320" y1="140" x2="378" y2="140" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="347" y="132" fill="#d97706" font-size="10" font-weight="600" text-anchor="middle">是</text>

  <!-- ③ PreToolUse 钩子（s04 新增） -->
  <text x="460" y="86" fill="#dc2626" font-size="11" font-weight="600" text-anchor="middle">s04 新增</text>
  <rect x="380" y="92" width="160" height="100" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="460" y="111" fill="#991b1b" font-size="11" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">trigger_hooks()</text>
  <text x="460" y="126" fill="#991b1b" font-size="10" font-weight="600" text-anchor="middle"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">PreToolUse</tspan> · 执行前</text>
  <rect x="396" y="133" width="128" height="34" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="0.8"/>
  <text x="460" y="147" fill="#991b1b" font-size="9" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">permission_hook</text>
  <text x="460" y="160" fill="#991b1b" font-size="9" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">log_hook</text>
  <text x="460" y="182" fill="#64748b" font-size="9" text-anchor="middle">返回非 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">None</tspan> → 阻止执行</text>

  <!-- PreToolUse 阻止 → 向下引出 -->
  <line x1="460" y1="192" x2="460" y2="224" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="470" y="212" fill="#dc2626" font-size="9" font-weight="600">阻止</text>
  <rect x="400" y="226" width="120" height="26" rx="13" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="460" y="243" fill="#991b1b" font-size="10" font-weight="600" text-anchor="middle">写入 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">tool_result</tspan></text>

  <!-- PreToolUse 通过 → TOOL_HANDLERS -->
  <line x1="540" y1="140" x2="588" y2="140" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="564" y="132" fill="#16a34a" font-size="9" font-weight="600" text-anchor="middle">通过</text>

  <!-- ④ TOOL_HANDLERS（s02 保留） -->
  <rect x="590" y="108" width="100" height="64" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="640" y="129" fill="#92400e" font-size="11" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">TOOL_HANDLERS</text>
  <text x="640" y="145" fill="#b45309" font-size="9" text-anchor="middle">工具分发 (dispatch)</text>
  <text x="640" y="162" fill="#b45309" font-size="9" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">bash/read/...</text>

  <!-- TOOL_HANDLERS → PostToolUse（向下） -->
  <line x1="640" y1="172" x2="640" y2="266" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="648" y="224" fill="#16a34a" font-size="9" font-weight="600">执行后</text>

  <!-- ⑤ PostToolUse 钩子（s04 新增） -->
  <rect x="560" y="268" width="160" height="72" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="640" y="287" fill="#991b1b" font-size="11" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">trigger_hooks()</text>
  <text x="640" y="302" fill="#991b1b" font-size="10" font-weight="600" text-anchor="middle"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">PostToolUse</tspan> · 执行后</text>
  <rect x="576" y="310" width="128" height="20" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="0.8"/>
  <text x="640" y="323" fill="#991b1b" font-size="9" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">large_output_hook</text>

  <!-- ===== 回环：结果回到 messages ===== -->
  <path d="M 720 304 L 760 304 L 760 360 L 95 360 L 95 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6,3"/>
  <text x="400" y="378" fill="#64748b" font-size="10" text-anchor="middle">结果追加到 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">messages[]</tspan>，循环继续</text>

  <!-- ===== 底部对比 ===== -->
  <rect x="60" y="400" width="680" height="56" rx="6" fill="#f1f5f9"/>
  <text x="80" y="423" fill="#94a3b8" font-size="10" font-weight="600">s03:</text>
  <text x="112" y="423" fill="#64748b" font-size="10" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">if not check_permission(block): ...</text>
  <text x="430" y="423" fill="#64748b" font-size="10">← 每加一个检查就要改循环</text>
  <text x="80" y="443" fill="#16a34a" font-size="10" font-weight="600">s04:</text>
  <text x="112" y="443" fill="#15803d" font-size="10" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">blocked = trigger_hooks("PreToolUse", block)</text>
  <text x="430" y="443" fill="#15803d" font-size="10">← 加检查 = <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">register_hook()</tspan>，循环不改</text>
</svg>
