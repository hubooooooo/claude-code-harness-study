<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 316" font-family="'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="720" height="316" fill="#fafbfc" rx="8"/>

  <!-- 标题栏 -->
  <rect x="0" y="0" width="720" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="23" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">权限管线 — 三道闸门</text>
  <text x="360" y="40" fill="#bfdbfe" font-size="10" text-anchor="middle">Permission Pipeline — three gates before a tool runs</text>

  <!-- 工具调用进入 -->
  <rect x="40" y="80" width="120" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="100" y="99" fill="#1e3a5f" font-size="12" font-weight="600" text-anchor="middle">工具调用进入</text>
  <text x="100" y="114" fill="#475569" font-size="9" text-anchor="middle">Tool call</text>

  <line x1="160" y1="102" x2="210" y2="102" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 闸门 1：拒绝列表 -->
  <rect x="214" y="72" width="145" height="60" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="286" y="91" fill="#991b1b" font-size="11" font-weight="700" text-anchor="middle">闸门 1：拒绝列表</text>
  <text x="286" y="105" fill="#b91c1c" font-size="9" text-anchor="middle">Deny list</text>
  <text x="286" y="121" fill="#991b1b" font-size="9" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">rm -rf /, sudo, shutdown</text>

  <line x1="359" y1="102" x2="409" y2="102" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 闸门 2：规则匹配 -->
  <rect x="413" y="72" width="145" height="60" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="485" y="91" fill="#92400e" font-size="11" font-weight="700" text-anchor="middle">闸门 2：规则匹配</text>
  <text x="485" y="105" fill="#b45309" font-size="9" text-anchor="middle">Rule match</text>
  <text x="485" y="121" fill="#92400e" font-size="9" text-anchor="middle">读写工作区外？含 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">rm</tspan> 等命令？</text>
  <text x="485" y="148" fill="#166534" font-size="9" font-weight="600" text-anchor="middle">未命中 → 允许 (allow)</text>

  <line x1="558" y1="102" x2="608" y2="102" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="583" y="94" fill="#92400e" font-size="9" font-weight="600" text-anchor="middle">命中</text>

  <!-- 闸门 3：用户审批 -->
  <rect x="612" y="72" width="90" height="60" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="657" y="91" fill="#92400e" font-size="11" font-weight="700" text-anchor="middle">闸门 3</text>
  <text x="657" y="106" fill="#92400e" font-size="10" text-anchor="middle">用户审批</text>
  <text x="657" y="121" fill="#b45309" font-size="9" text-anchor="middle">User approval</text>
  <text x="657" y="148" fill="#64748b" font-size="9" font-weight="600" text-anchor="middle">允许 / 拒绝</text>

  <!-- 三种决策 -->
  <rect x="40" y="164" width="662" height="132" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="186" fill="#1e3a5f" font-size="12" font-weight="600">三种决策 <tspan fill="#64748b" font-size="10" font-weight="400">(Decisions)</tspan></text>

  <rect x="60" y="200" width="200" height="44" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="160" y="218" fill="#991b1b" font-size="11" font-weight="600" text-anchor="middle">阻止 (deny)</text>
  <text x="160" y="234" fill="#b91c1c" font-size="9" text-anchor="middle">闸门 1 命中，或用户拒绝</text>

  <rect x="280" y="200" width="200" height="44" rx="4" fill="#fff7ed" stroke="#d97706" stroke-width="1"/>
  <text x="380" y="218" fill="#92400e" font-size="11" font-weight="600" text-anchor="middle">询问 (ask)</text>
  <text x="380" y="234" fill="#b45309" font-size="9" text-anchor="middle">闸门 2 命中，进入闸门 3</text>

  <rect x="500" y="200" width="182" height="44" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="591" y="218" fill="#166534" font-size="11" font-weight="600" text-anchor="middle">允许 (allow)</text>
  <text x="591" y="234" fill="#15803d" font-size="9" text-anchor="middle">规则未命中，或用户允许</text>

  <text x="371" y="276" fill="#64748b" font-size="10" text-anchor="middle">规则优先：闸门 1 硬拒绝 → 闸门 2 规则匹配 → 命中则用户审批，未命中默认允许</text>
</svg>
