<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 356" font-family="'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="720" height="356" fill="#fafbfc" rx="8"/>

  <!-- 标题栏 -->
  <rect x="0" y="0" width="720" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="23" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">权限 — 循环不变，工具执行前加一道门</text>
  <text x="360" y="40" fill="#bfdbfe" font-size="10" text-anchor="middle">Permission — same loop, one gate before tool execution</text>

  <!-- ===== s02 保留 ===== -->
  <text x="50" y="74" fill="#94a3b8" font-size="11" font-weight="600">s02 保留</text>

  <!-- messages[] -->
  <rect x="60" y="86" width="120" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="120" y="105" fill="#334155" font-size="12" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">messages[]</text>
  <text x="120" y="121" fill="#64748b" font-size="9" text-anchor="middle">消息列表</text>

  <!-- 箭头 → LLM -->
  <line x1="180" y1="108" x2="228" y2="108" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- LLM -->
  <rect x="230" y="84" width="130" height="48" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="295" y="104" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">大模型 (LLM)</text>
  <text x="295" y="122" fill="#475569" font-size="10" text-anchor="middle"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">tool_use</tspan> 块？</text>

  <!-- 否 → 返回 -->
  <line x1="295" y1="132" x2="295" y2="156" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="306" y="149" fill="#16a34a" font-size="10" font-weight="600">否</text>

  <rect x="235" y="158" width="120" height="38" rx="19" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="295" y="174" fill="#166534" font-size="11" font-weight="600" text-anchor="middle">返回结果</text>
  <text x="295" y="188" fill="#15803d" font-size="9" text-anchor="middle">循环结束 (end_turn)</text>

  <!-- 是 → 权限检查 -->
  <line x1="360" y1="108" x2="400" y2="108" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <text x="380" y="100" fill="#d97706" font-size="10" font-weight="600" text-anchor="middle">是</text>

  <!-- ===== s03 新增：权限检查 ===== -->
  <text x="482" y="72" fill="#dc2626" font-size="11" font-weight="600" text-anchor="middle">s03 新增</text>

  <!-- 权限检查框 -->
  <rect x="402" y="78" width="160" height="146" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="482" y="98" fill="#991b1b" font-size="11" font-weight="700" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">check_permission()</text>

  <!-- 闸门 1 -->
  <rect x="416" y="108" width="132" height="32" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
  <text x="482" y="122" fill="#991b1b" font-size="10" font-weight="600" text-anchor="middle">闸门 1：拒绝列表</text>
  <text x="482" y="134" fill="#b91c1c" font-size="9" text-anchor="middle">Deny list</text>

  <!-- 闸门 2 -->
  <rect x="416" y="146" width="132" height="32" rx="4" fill="#fff7ed" stroke="#d97706" stroke-width="1"/>
  <text x="482" y="160" fill="#92400e" font-size="10" font-weight="600" text-anchor="middle">闸门 2：规则匹配</text>
  <text x="482" y="172" fill="#b45309" font-size="9" text-anchor="middle">Rule match</text>

  <!-- 闸门 3 -->
  <rect x="416" y="184" width="132" height="32" rx="4" fill="#fff7ed" stroke="#d97706" stroke-width="1"/>
  <text x="482" y="198" fill="#92400e" font-size="10" font-weight="600" text-anchor="middle">闸门 3：用户审批</text>
  <text x="482" y="210" fill="#b45309" font-size="9" text-anchor="middle">User approval</text>

  <!-- 拒绝：拒绝信息成为 tool_result，与通过路径的输出汇合 -->
  <path d="M 440 224 L 440 238" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="447" y="235" fill="#dc2626" font-size="9" font-weight="600">拒绝</text>

  <!-- 通过 → 工具执行 -->
  <line x1="562" y1="158" x2="598" y2="158" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="580" y="151" fill="#16a34a" font-size="9" font-weight="600" text-anchor="middle">通过</text>

  <!-- ===== s02 保留：工具执行 ===== -->
  <text x="650" y="120" fill="#94a3b8" font-size="9" text-anchor="middle">s02 保留</text>

  <!-- TOOL_HANDLERS -->
  <rect x="600" y="126" width="100" height="64" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="650" y="146" fill="#92400e" font-size="11" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">TOOL_HANDLERS</text>
  <text x="650" y="162" fill="#b45309" font-size="9" text-anchor="middle">工具分发 (dispatch)</text>
  <text x="650" y="179" fill="#b45309" font-size="9" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">bash/read/...</text>

  <!-- 通过路径的输出：TOOL_HANDLERS 结果 → tool_result -->
  <path d="M 650 190 L 650 254 L 494 254" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6,3"/>

  <!-- tool_result：成功的输出和拒绝都会成为 tool_result -->
  <rect x="370" y="240" width="122" height="28" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="431" y="258" fill="#334155" font-size="11" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">tool_result</text>

  <!-- tool_result → 回到消息列表 -->
  <path d="M 370 254 L 120 254 L 120 132" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6,3"/>
  <text x="245" y="247" fill="#64748b" font-size="9" text-anchor="middle">追加进 messages，循环继续</text>

  <!-- ===== 图例 ===== -->
  <rect x="60" y="286" width="600" height="54" rx="6" fill="#f1f5f9"/>
  <rect x="80" y="299" width="12" height="12" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="100" y="309" fill="#334155" font-size="10">s02 保留（循环、LLM、分发——完全不变）</text>
  <rect x="400" y="299" width="12" height="12" rx="2" fill="#fef2f2" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="420" y="309" fill="#334155" font-size="10">s03 新增（三道闸门权限管线）</text>
  <text x="80" y="329" fill="#64748b" font-size="10">被拒绝的调用不执行，但同样写入一条 <tspan fill="#1e3a5f" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">tool_result</tspan>（"Permission denied."），模型能知道它被拦下了。</text>
</svg>
