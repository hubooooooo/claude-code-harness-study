<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 446" font-family="'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="760" height="446" fill="#fafbfc" rx="8"/>

  <!-- 标题栏 -->
  <rect x="0" y="0" width="760" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="760" height="8" fill="url(#header)"/>
  <rect x="0" y="45" width="760" height="3" fill="#00e75e"/>
  <text x="380" y="23" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">记忆 — 存储、召回、提取与整理</text>
  <text x="380" y="40" fill="#b3b3b3" font-size="10" text-anchor="middle">Memory — store, recall, extract and consolidate</text>

  <!-- 图例 -->
  <rect x="40" y="60" width="12" height="10" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="58" y="69" fill="#1e3a5f" font-size="10" font-weight="600">智能体循环 (Agent Loop)</text>
  <rect x="190" y="60" width="12" height="10" rx="2" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="208" y="69" fill="#5b21b6" font-size="10" font-weight="600">记忆 (Memory)</text>
  <rect x="300" y="60" width="12" height="10" rx="2" fill="#fff7ed" stroke="#d97706" stroke-width="1"/>
  <text x="318" y="69" fill="#92400e" font-size="10" font-weight="600">工具执行 (Tool)</text>

  <!-- ===== messages[] ===== -->
  <rect x="30" y="108" width="100" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="80" y="131" fill="#334155" font-size="12" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">messages[]</text>
  <text x="80" y="148" fill="#64748b" font-size="10" text-anchor="middle">消息列表</text>

  <!-- 箭头：messages → 选择 -->
  <line x1="130" y1="134" x2="153" y2="134" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- ===== 选择 ===== -->
  <rect x="155" y="94" width="135" height="80" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="222" y="114" fill="#5b21b6" font-size="12" font-weight="700" text-anchor="middle">选择 (Selection)</text>
  <text x="222" y="131" fill="#6d28d9" font-size="10" text-anchor="middle">目录 + 当前请求</text>
  <text x="222" y="146" fill="#6d28d9" font-size="10" text-anchor="middle">模型或关键词匹配</text>
  <text x="222" y="163" fill="#6d28d9" font-size="9" text-anchor="middle">最多 5 条 (≤ 5)</text>

  <!-- 箭头：选择 → 召回 -->
  <line x1="290" y1="134" x2="318" y2="134" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- ===== 召回 ===== -->
  <rect x="320" y="94" width="120" height="80" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="380" y="114" fill="#5b21b6" font-size="12" font-weight="700" text-anchor="middle">召回 (Recall)</text>
  <text x="380" y="131" fill="#6d28d9" font-size="10" text-anchor="middle">读取选中的文件</text>
  <text x="380" y="146" fill="#6d28d9" font-size="10" text-anchor="middle">加入系统上下文</text>
  <text x="380" y="163" fill="#6d28d9" font-size="9" text-anchor="middle">正文总量受限</text>

  <!-- 箭头：召回 → LLM -->
  <line x1="440" y1="134" x2="463" y2="134" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== LLM ===== -->
  <rect x="465" y="104" width="100" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="515" y="124" fill="#1e3a5f" font-size="12" font-weight="700" text-anchor="middle">大模型 (LLM)</text>
  <text x="515" y="141" fill="#475569" font-size="10" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">tool_use</text>
  <text x="515" y="156" fill="#475569" font-size="10" text-anchor="middle">块存在？</text>

  <!-- LLM → 否 → 返回结果 -->
  <line x1="515" y1="164" x2="515" y2="194" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="526" y="183" fill="#16a34a" font-size="9" font-weight="600">否，停止</text>
  <rect x="460" y="196" width="110" height="24" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="515" y="212" fill="#166534" font-size="10" font-weight="600" text-anchor="middle">返回结果</text>

  <!-- LLM → 是 → TOOL_HANDLERS -->
  <line x1="565" y1="134" x2="588" y2="134" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="576" y="127" fill="#64748b" font-size="9" font-weight="600" text-anchor="middle">是</text>

  <!-- ===== TOOL_HANDLERS ===== -->
  <rect x="590" y="96" width="130" height="76" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="655" y="116" fill="#92400e" font-size="11" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">TOOL_HANDLERS</text>
  <text x="655" y="132" fill="#b45309" font-size="10" text-anchor="middle">工具分发表</text>
  <text x="655" y="148" fill="#b45309" font-size="9" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">bash · read · write</text>
  <text x="655" y="162" fill="#b45309" font-size="9" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">edit · glob</text>

  <!-- ===== 记忆文件 (s09) ===== -->
  <rect x="155" y="248" width="430" height="36" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="370" y="271" fill="#5b21b6" font-size="11" font-weight="600" text-anchor="middle"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">.memory/</tspan> — <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">MEMORY.md</tspan> 索引 + <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">*.md</tspan> 文件（跨会话持久化）</text>

  <!-- 箭头：记忆文件 → 选择 / 召回 -->
  <path d="M 240 248 L 240 176" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="250" y="216" fill="#6d28d9" font-size="9">目录 (catalog)</text>
  <path d="M 395 248 L 395 176" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="405" y="216" fill="#6d28d9" font-size="9">正文 (body)</text>

  <!-- 箭头：返回结果 → 提取 → 记忆文件 -->
  <path d="M 515 220 L 515 246" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="526" y="238" fill="#6d28d9" font-size="9">提取 Extraction（每轮结束后）</text>

  <!-- 整理说明 -->
  <text x="165" y="302" fill="#6d28d9" font-size="9">整理 Consolidation：文件数 ≥ 10 时触发，去重 · 合并 · 剪枝</text>

  <!-- ===== 回环 ===== -->
  <path d="M 720 134 L 748 134 Q 756 134 756 142 L 756 322 Q 756 330 748 330 L 88 330 Q 80 330 80 322 L 80 162" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6,3"/>
  <text x="400" y="350" fill="#64748b" font-size="10" text-anchor="middle">工具结果 → <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">messages[]</tspan> → 选择 → 召回 → 大模型 → 回合结束后提取</text>

  <!-- ===== 底部要点 ===== -->
  <rect x="40" y="368" width="680" height="60" rx="6" fill="#f1f5f9"/>
  <rect x="60" y="383" width="12" height="10" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="80" y="392" fill="#334155" font-size="10">智能体循环 (Agent Loop)：<tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">messages</tspan> → 大模型 → <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">tool_use</tspan> → 工具结果 → <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">messages</tspan></text>
  <rect x="60" y="404" width="12" height="10" rx="2" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="80" y="413" fill="#334155" font-size="10">记忆 (Memory)：选择相关记录 → 召回正文 → 提取持久知识 → 达到阈值后整理</text>
</svg>
