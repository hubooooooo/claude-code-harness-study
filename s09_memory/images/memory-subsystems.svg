<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="720" height="330" fill="#fafbfc" rx="8"/>

  <!-- 标题栏 -->
  <rect x="0" y="0" width="720" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#header)"/>
  <rect x="0" y="45" width="720" height="3" fill="#00e75e"/>
  <text x="360" y="23" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">记忆系统 — 存储 · 召回 · 提取 · 整理</text>
  <text x="360" y="40" fill="#b3b3b3" font-size="10" text-anchor="middle">Memory System — storage · recall · extraction · consolidation</text>

  <!-- ===== 存储 ===== -->
  <rect x="40" y="68" width="145" height="100" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="112" y="89" fill="#5b21b6" font-size="13" font-weight="700" text-anchor="middle">存储</text>
  <text x="112" y="103" fill="#6d28d9" font-size="10" text-anchor="middle">Storage</text>
  <line x1="55" y1="111" x2="170" y2="111" stroke="#e2e8f0" stroke-width="1"/>
  <text x="55" y="129" fill="#5b21b6" font-size="10"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">.memory/*.md</tspan> 文件</text>
  <text x="55" y="145" fill="#5b21b6" font-size="10"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">MEMORY.md</tspan> 索引</text>

  <line x1="190" y1="118" x2="218" y2="118" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- ===== 召回 ===== -->
  <rect x="222" y="68" width="200" height="100" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="322" y="89" fill="#5b21b6" font-size="13" font-weight="700" text-anchor="middle">召回</text>
  <text x="322" y="103" fill="#6d28d9" font-size="10" text-anchor="middle">Recall</text>
  <line x1="237" y1="111" x2="407" y2="111" stroke="#e2e8f0" stroke-width="1"/>
  <text x="237" y="129" fill="#5b21b6" font-size="10">索引加入系统提示词 (system prompt)</text>
  <text x="237" y="145" fill="#5b21b6" font-size="10">模型选择相关文件</text>
  <text x="237" y="159" fill="#6d28d9" font-size="9">≤ 5 条，失败降级到关键词匹配</text>

  <line x1="425" y1="118" x2="453" y2="118" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- ===== 提取 ===== -->
  <rect x="457" y="68" width="130" height="100" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="522" y="89" fill="#5b21b6" font-size="13" font-weight="700" text-anchor="middle">提取</text>
  <text x="522" y="103" fill="#6d28d9" font-size="10" text-anchor="middle">Extraction</text>
  <line x1="472" y1="111" x2="572" y2="111" stroke="#e2e8f0" stroke-width="1"/>
  <text x="472" y="129" fill="#5b21b6" font-size="10">回合结束后触发</text>
  <text x="472" y="145" fill="#5b21b6" font-size="10">模型提取持久知识</text>
  <text x="472" y="159" fill="#6d28d9" font-size="9"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">scope</tspan> + 重复检查</text>

  <!-- ===== 整理 ===== -->
  <rect x="600" y="68" width="100" height="100" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="650" y="89" fill="#5b21b6" font-size="13" font-weight="700" text-anchor="middle">整理</text>
  <text x="650" y="103" fill="#6d28d9" font-size="10" text-anchor="middle">Consolidation</text>
  <line x1="612" y1="111" x2="688" y2="111" stroke="#e2e8f0" stroke-width="1"/>
  <text x="612" y="129" fill="#5b21b6" font-size="10">文件 ≥ 10 触发</text>
  <text x="612" y="145" fill="#5b21b6" font-size="10">去重·合并·剪枝</text>
  <text x="612" y="159" fill="#6d28d9" font-size="9">快照 + 失败恢复</text>

  <!-- ===== 记忆文件 ===== -->
  <rect x="40" y="212" width="660" height="36" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="370" y="235" fill="#5b21b6" font-size="11" text-anchor="middle"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">.memory/</tspan> — <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">MEMORY.md</tspan> 索引 + <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">*.md</tspan> 文件（YAML frontmatter：<tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">name / description / type</tspan>）</text>

  <!-- 箭头：存储 → 记忆文件 -->
  <path d="M 112 168 L 112 210" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="120" y="194" fill="#6d28d9" font-size="9">写入 / 读取</text>

  <!-- 箭头：提取 → 记忆文件 -->
  <path d="M 522 168 L 522 210" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="530" y="194" fill="#6d28d9" font-size="9">写入</text>

  <!-- 箭头：整理 → 记忆文件 -->
  <path d="M 650 168 L 650 210" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="658" y="194" fill="#6d28d9" font-size="9">覆写</text>

  <!-- ===== 四类记忆 ===== -->
  <rect x="40" y="268" width="660" height="44" rx="6" fill="#f1f5f9"/>
  <text x="60" y="294" fill="#5b21b6" font-size="10" font-weight="600">四类记忆 (<tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">type</tspan>)：</text>
  <text x="148" y="294" fill="#334155" font-size="10"><tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#5b21b6">user</tspan>（你是谁）· <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#5b21b6">feedback</tspan>（怎么做事）· <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#5b21b6">project</tspan>（正在发生什么）· <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#5b21b6">reference</tspan>（东西在哪找）</text>
</svg>
