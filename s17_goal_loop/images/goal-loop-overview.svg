<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="960" height="620" fill="#fafbfc" rx="8"/>

  <!-- 标题栏 -->
  <rect x="0" y="0" width="960" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="960" height="8" fill="url(#header)"/>
  <rect x="0" y="45" width="960" height="3" fill="#00e75e"/>
  <text x="480" y="23" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">目标循环 — 模型提出停止，独立判断器决定是否继续</text>
  <text x="480" y="40" fill="#b3b3b3" font-size="10" text-anchor="middle">Goal Loop — the return boundary checks the active goal before the turn can end</text>

  <!-- ===== Agent 会话 ===== -->
  <rect x="24" y="66" width="912" height="478" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="44" y="90" fill="#334155" font-size="13" font-weight="700">Agent 会话 (Agent Session)</text>

  <!-- messages[] -->
  <rect x="44" y="150" width="140" height="58" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="114" y="174" text-anchor="middle" fill="#334155" font-size="12" font-weight="600" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">messages[]</text>
  <text x="114" y="193" text-anchor="middle" fill="#64748b" font-size="10">对话与工具结果</text>

  <line x1="184" y1="179" x2="214" y2="179" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- 主模型 -->
  <rect x="216" y="150" width="150" height="58" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="291" y="174" text-anchor="middle" fill="#1e3a5f" font-size="12" font-weight="700">主模型 (Worker)</text>
  <text x="291" y="193" text-anchor="middle" fill="#475569" font-size="10">调用工具、执行操作</text>

  <line x1="366" y1="179" x2="396" y2="179" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- 没有 tool_use -->
  <rect x="398" y="150" width="140" height="58" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="468" y="174" text-anchor="middle" fill="#334155" font-size="12" font-weight="700">没有 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">tool_use</tspan></text>
  <text x="468" y="193" text-anchor="middle" fill="#64748b" font-size="10">主模型提出停止</text>

  <line x1="538" y1="179" x2="570" y2="179" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- ===== 目标闸门（本章新增） ===== -->
  <rect x="572" y="112" width="340" height="304" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="590" y="136" fill="#991b1b" font-size="13" font-weight="700">目标闸门 (Goal Gate)</text>
  <text x="762" y="136" text-anchor="middle" fill="#dc2626" font-size="10" font-weight="600">s17 新增</text>
  <text x="894" y="136" text-anchor="end" fill="#b91c1c" font-size="10" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">GoalController</text>

  <!-- Stop hook 检查 -->
  <rect x="596" y="150" width="292" height="50" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <text x="742" y="171" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="700">Stop hook 检查</text>
  <text x="742" y="189" text-anchor="middle" fill="#b91c1c" font-size="10">是否有活跃目标 · 后台任务是否还在跑</text>

  <line x1="742" y1="200" x2="742" y2="304" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- 目标条件 -->
  <rect x="596" y="220" width="134" height="62" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="663" y="240" text-anchor="middle" fill="#5b21b6" font-size="12" font-weight="700">目标条件</text>
  <text x="663" y="254" text-anchor="middle" fill="#6d28d9" font-size="9">Goal condition</text>
  <text x="663" y="271" text-anchor="middle" fill="#6d28d9" font-size="10">可检查的结束状态</text>

  <!-- 对话记录 -->
  <rect x="754" y="220" width="134" height="62" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="821" y="240" text-anchor="middle" fill="#334155" font-size="12" font-weight="700">对话记录</text>
  <text x="821" y="254" text-anchor="middle" fill="#64748b" font-size="9">Conversation</text>
  <text x="821" y="271" text-anchor="middle" fill="#64748b" font-size="10">已写明的证据</text>

  <path d="M 663 282 L 663 292 L 700 292 L 700 304" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <path d="M 821 282 L 821 292 L 784 292 L 784 304" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 判断器 -->
  <rect x="650" y="306" width="184" height="54" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="742" y="328" text-anchor="middle" fill="#1e3a5f" font-size="12" font-weight="700">判断器 (Evaluator)</text>
  <text x="742" y="347" text-anchor="middle" fill="#475569" font-size="10">不带工具的独立模型调用</text>

  <!-- 判定菱形 -->
  <line x1="742" y1="360" x2="742" y2="372" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="742,372 756,386 742,400 728,386" fill="#ffffff" stroke="#64748b" stroke-width="1.3"/>

  <!-- 阻止 → 追加理由 -->
  <path d="M 728 386 L 610 386 L 610 468" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="669" y="379" text-anchor="middle" fill="#b91c1c" font-size="10" font-weight="600">阻止 + 理由 (block)</text>

  <rect x="330" y="470" width="380" height="54" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
  <text x="520" y="492" text-anchor="middle" fill="#92400e" font-size="12" font-weight="700">把判断理由追加进 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">messages[]</tspan></text>
  <text x="520" y="511" text-anchor="middle" fill="#b45309" font-size="10">在同一个 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">while</tspan> 循环里 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">continue</tspan>，继续下一轮</text>

  <!-- 回到 messages[] -->
  <path d="M 330 497 L 114 497 L 114 210" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-red)"/>

  <!-- 放行 / 终止 → 返回用户 -->
  <path d="M 756 386 L 845 386 L 845 468" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="805" y="379" text-anchor="middle" fill="#15803d" font-size="10" font-weight="600">放行 / 终止 (allow)</text>

  <rect x="768" y="470" width="154" height="54" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="845" y="492" text-anchor="middle" fill="#166534" font-size="12" font-weight="700">返回给用户</text>
  <text x="845" y="511" text-anchor="middle" fill="#15803d" font-size="10">本轮真正结束</text>

  <!-- 底部要点 -->
  <rect x="40" y="560" width="880" height="48" rx="6" fill="#f1f5f9"/>
  <text x="60" y="580" fill="#334155" font-size="10">判断器是闸门的一部分：它只读取对话里已有的证据，从不运行工具。没有活跃目标时，Stop hook 直接放行，退出条件与 s01 相同。</text>
  <text x="60" y="598" fill="#64748b" font-size="10">The evaluator is part of the gate; it reads evidence already present in the conversation and never runs tools.</text>
</svg>
